# Full self-hosted stdlib bundle manifest.
#
# Unlike `lyric.toml` (the bootstrap smoke set built by the F# stage-0
# emitter), this manifest enumerates the *entire* public stdlib surface and
# is compiled by the self-hosted compiler:
#
#     ./bin/lyric build --manifest lyric-stdlib/lyric.full.toml
#
# It is the stage-2 self-hosting verification target (#2592): every package
# here must type-check and emit through the self-hosted MSIL backend.  As the
# F# stage-0 emitter is retired, packages migrate from here into `lyric.toml`.

[package]
name        = "Lyric.Stdlib.Full"
version     = "0.1.0"
description = "Lyric standard library — full self-hosted bundle."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[project]
name            = "Lyric.Stdlib.Full"
output          = "single"
output_assembly = "Lyric.Stdlib.dll"

[project.packages]
# Tier 0 — base layer.
"Std.Core"             = "std/core.l"
"Std.Errors"           = "std/errors.l"
# Kernel boundary for Std.String's StringBuilder and indexOfFrom (#7257).
"Std.StringHost"       = "std/_kernel/string_host.l"
"Std.String"           = "std/string.l"
"Std.Core.Proof"       = "std/core_proof.l"

# Pure-Lyric argv encoder/decoder shared by Std.Process, Std.ProcessCapture
# and every process kernel twin (#7234); no dependencies beyond Std.Core and
# Std.Collections.
"Std.ProcessArgs"      = "std/process_args.l"

# Kernel boundaries (extern type / @externTarget host shims).
"Std.ProcessHost"      = "std/_kernel/process_host.l"
"Std.ProcessCaptureHost" = "std/_kernel/process_capture_host.l"
"Std.ProcessPipedHost" = "std/_kernel/process_piped_host.l"
"Std.ConsoleHost"      = "std/_kernel/console_host.l"
"Std.RegexHost"        = "std/_kernel/regex_host.l"
"Std.CharHost"         = "std/_kernel/char_host.l"
"Std.FormatHost"       = "std/_kernel/format_host.l"
"Std.EncodingHost"     = "std/_kernel/encoding_host.l"
"Std.RandomHost"       = "std/_kernel/random_host.l"
"Std.ParallelHost"     = "std/_kernel/parallel_host.l"   # seed: current
"Std.SecureRandomHost" = "std/_kernel/secure_random_host.l"
"Std.UuidHost"         = "std/_kernel/uuid_host.l"
"Std.FileHost"         = "std/_kernel/file_host.l"
"Std.PathHost"         = "std/_kernel/path_host.l"
"Std.EnvironmentHost"  = "std/_kernel/environment_host.l"
"Std.LogHost"          = "std/_kernel/log_host.l"
"Std.HashHost"         = "std/_kernel/hash_host.l"
"Std.TimeHost"         = "std/_kernel/time_host.l"
"Std.JsonHost"         = "std/_kernel/json_host.l"
"Std.MathHost"         = "std/_kernel/math_host.l"
"Std.ParseHost"        = "std/_kernel/parse_host.l"
"Std.UnicodeHost"      = "std/_kernel/unicode_host.l"
"Std.CollectionsHost"  = "std/_kernel/collections_host.l"
"Std.VerifierEnvHost"  = "std/_kernel/verifier_env_host.l"

# Tier 1 — collections, regex, processes.
"Std.Regex"            = "std/regex.l"
"Std.Collections"      = "std/collections.l"
"Std.ProcessCapture"   = "std/process_capture.l"
"Std.Process"          = "std/process.l"
# Build metadata surface (docs/60 §9.2) — type only; compiler synthesizes
# the per-build `buildInfo()` accessor into the consumer's root package.
"Std.BuildInfo"        = "std/buildinfo.l"

# Tier 2 — numeric, text, stream, char.
"Std.Math"             = "std/math.l"
# Vec2/Vec3/Vec4/Quat/Mat3/Mat4/Rgba8 for graphics and games (docs/67 §4.6).
"Std.Linalg"           = "std/linalg.l"          # seed: current
"Std.Parse"            = "std/parse.l"
"Std.Stream"           = "std/stream.l"
"Std.Char"             = "std/char.l"
"Std.Set"              = "std/set.l"
"Std.Iter"             = "std/iter.l"
"Std.Sort"             = "std/sort.l"
"Std.Buffer"           = "std/buffer.l"          # seed: current
"Std.Format"           = "std/format.l"
"Std.Encoding"         = "std/encoding.l"

# Tier 3 — randomness, hashing, ids.
"Std.Random"           = "std/random.l"
"Std.Parallel"         = "std/parallel.l"        # seed: current
"Std.SecureRandom"     = "std/secure_random.l"
"Std.Uuid"             = "std/uuid.l"

# Tier 4 — filesystem, environment, logging, console.
"Std.Path"             = "std/path.l"
"Std.File"             = "std/file.l"
"Std.Directory"        = "std/directory.l"
"Std.Environment"      = "std/environment.l"
"Std.Log"              = "std/log.l"
"Std.Console"          = "std/console.l"
"Std.Hash"             = "std/hash.l"

# Tier 5 — structured data, markup, time.
"Std.Time"             = "std/time.l"
"Std.BenchHost"        = "std/_kernel/bench_host.l"
"Std.Bench"            = "std/bench.l"
"Std.Json"             = "std/json.l"
"Std.Xml"              = "std/xml.l"
"Std.Yaml"             = "std/yaml.l"

# Tier 5.5 — HTTP/async surface (D111).  Placed after structured-data tiers so
# that inserting these packages does not shift the MethodDef token indices of
# Std.Time, Std.Json, Std.Xml, and Std.Yaml in Lyric.Stdlib.dll.  The seed
# binary resolves those tokens at compile time; reordering them breaks the
# compiler-self-tests (contract_meta_self_test.l array-enumeration returns empty).
"Std.Task"             = "std/_kernel/task.l"
# Std.TlsHost/Std.Tls precede Std.HttpHost/Std.Http here (moved up from
# after Std.Rest, #5877): Std.HttpHost's TLS client wiring imports
# Std.TlsHost + Std.Tls directly (docs/61 §3.2), so both must already be
# compiled by the time Std.HttpHost is processed.
"Std.TlsHost"          = "std/_kernel/tls_host.l"
"Std.Tls"              = "std/tls.l"
"Std.HttpHost"         = "std/_kernel/http_host.l"
"Std.Http"             = "std/http.l"
"Std.HttpServer"       = "std/_kernel/http_server.l"
"Std.Rest"             = "std/rest.l"
"Std.HttpEngine"         = "std/http_engine.l"
"Std.HttpEngine.Hpack"   = "std/http_hpack.l"
"Std.HttpEngine.H2Frame" = "std/http_h2frame.l"
"Std.HttpEngine.H2Conn"  = "std/http_h2conn.l"
"Std.TcpHost"          = "std/_kernel/tcp_host.l"

# Tier 6 — regex compatibility shim.
"Std.RegexSafe"        = "std/regex_safe.l"

# Tier 7 — testing utilities + app host.
"Std.Testing.Mocking"  = "std/testing_mocking.l"
"Std.Testing"          = "std/testing.l"
"Std.Testing.Property" = "std/testing_property.l"
"Std.Testing.Snapshot" = "std/testing_snapshot.l"
"Std.App"              = "std/app.l"

# Tier 8 — persistent collections (#684). Appended last so earlier packages'
# token indices are unchanged; bundled since #7280 gave it its own types
# (`PersistentList[T]`), which D111 requires to live in Lyric.Stdlib.
"Std.Collections.Persistent" = "std/collections_persistent.l"

# Tier 9 — cross-target JSON value model (D145, #7832), formerly
# lyric-jsonrpc's JsonRpc.Json.  Appended last for the same reason as Tier 8.
"Std.JsonValue" = "std/json_value.l"

# Tier 10 — C memory and C strings for `@library` bindings (D161).  Appended
# last for the same reason as Tier 8.  `@library` (D158) and the byte
# intrinsics postdate the v0.7.5 release, so the stage-0 seed cannot compile
# these: `scripts/bootstrap.sh` leaves lines marked `seed: current` out of the
# seed-built stage-1 bundle, which only has to run the compiler, and the full
# bundle is rebuilt by the compiler stage 1 produces.
"Std.FfiHost"   = "std/_kernel/ffi_host.l"  # seed: current
"Std.Ffi"       = "std/ffi.l"               # seed: current

# Tier 11 — JSON-RPC 2.0 peer and stdio framings (D204), formerly the
# lyric-jsonrpc library's JsonRpc / JsonRpc.Stdio.  Appended last for the
# same reason as Tier 8.  Std.PanicGuardHost (the handler-panic guard, with
# a native twin) is imported by Std.JsonRpc, so it precedes it.
"Std.PanicGuardHost" = "std/_kernel/panic_guard_host.l"
"Std.JsonRpc"       = "std/json_rpc.l"
"Std.JsonRpc.Stdio" = "std/json_rpc_stdio.l"

# Tier 12 — plugin runtime (docs/69, D207): the platform probe kernel and
# `Std.Plugin` (manifests, the host catalogue and process lifecycle, the
# plugin-side server loop).  Appended last for the same reason as Tier 8.
# The self-hosted compiler imports `Std.Plugin` to run generator plugins, so
# neither line may be `seed: current`.
"Std.PluginHost" = "std/_kernel/plugin_host.l"
"Std.Plugin"     = "std/plugin.l"
# Trusted (in-process) plugin loading (docs/69 §10, D230).  The compiler does
# not load plugins in process, and the kernel uses `externAsObject` (D212),
# which postdates the seed.
"Std.PluginTrustedHost" = "std/_kernel/plugin_trusted_host.l"  # seed: current
"Std.Plugin.Trusted"    = "std/plugin_trusted.l"               # seed: current

# Tier 13 — runtime access to `config { }` field annotations (#6866,
# #7180): the per-target resource-reading kernel and `Std.AnnotationMeta`.
# Appended last for the same reason as Tier 8; it imports `Std.JsonValue`
# (Tier 9), which precedes it.
"Std.AnnotationMetaHost" = "std/_kernel/annotation_meta_host.l"
"Std.AnnotationMeta"     = "std/annotation_meta.l"

# Tier 14 — the in-process wasm runtime for component plugins (docs/69 §9.3):
# the shared-library loader kernel, the `@library("lyric_wasmhost")`
# bindings and `Std.PluginWasm`.  Appended last for the same reason as Tier 8.
# They use `@library` callbacks (D229), newer than the released seed, and the
# compiler does not import them (`Std.Plugin` takes the runtime through
# `PluginHostConfig.componentRuntime` precisely so that it need not).
"Std.PluginWasmLoad" = "std/_kernel/plugin_wasm_load.l"  # seed: current
"Std.PluginWasmBind" = "std/_kernel/plugin_wasm_bind.l"  # seed: current
"Std.PluginWasm"     = "std/plugin_wasm.l"               # seed: current
