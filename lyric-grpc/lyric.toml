# lyric-grpc — gRPC client and server library for Lyric.
#
# Ships seven packages:
#   Grpc.Types         — platform-neutral types: GrpcChannel, GrpcStatus,
#                        GrpcStatusCode, GrpcCallOptions, GrpcStream.
#   Grpc               — client API (openChannel, openChannelWith, callUnary,
#                        openServerStream) and server API (ServiceRegistry, start).
#   Grpc.Client        — pure-Lyric client over Std.HttpEngine.H2Client (default).
#   Grpc.Wire          — gRPC-over-HTTP/2 framing, gzip, status mapping.
#   Grpc.Aspects       — pub aspect templates: RequiresGrpcAuth,
#                        RequiresGrpcRole, GrpcRateLimit, GrpcCircuitBreaker.
#   Grpc.Kernel.Net    — Grpc.Net.Client / Grpc.Core.Api client, selected by the
#                        `legacy-client` feature (removed in docs/72 slice 10).
#   Grpc.Kernel.Jvm    — grpc-java client and server (client: `legacy-client`).
#
# Client usage (unary call):
#   val ch = Grpc.openChannel("https://collector:4317").unwrap()
#   match Grpc.callUnary(ch, "svc.Name", "Method", req, Grpc.defaultOptions()) {
#     case Err(st) -> log("rpc failed: " + st.message)
#     case Ok(resp) -> { ... }
#   }
#   Grpc.closeChannel(ch)
#
# Server usage (service hosting):
#   val registry = Grpc.create()
#   val registry = Grpc.addMethod(registry, "Svc", "Method", "Pkg.handler")
#   Grpc.start(registry)
#
# Auth aspects delegate to lyric-auth; circuit-breaker to lyric-resilience.
# Field numbering: declaration-order default + lyric-grpc.lock + @proto_field.
# See docs/37-grpc-proto-sketch.md.

[package]
name        = "Lyric.Grpc"
version     = "0.1.0"
stability = "experimental"
description = "gRPC client and server library for Lyric — unary, streaming, service hosting, and aspect templates."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[features]
default = ["dotnet"]
dotnet = []
# io.grpc (grpc-java) backend.
jvm    = []
# Select the SDK client kernels (Grpc.Net.Client on dotnet, grpc-java on the JVM)
# instead of the pure-Lyric client; removed with those kernels (docs/72 slice 10).
legacy-client = []

[project]
name            = "Lyric.Grpc"
output          = "single"
output_assembly = "Lyric.Grpc.dll"

[project.packages]
# Platform-neutral types: GrpcChannel, GrpcStatus, GrpcStatusCode, etc.
"Grpc.Types"      = "src/types.l"
# Client + server public API.
"Grpc"            = "src/grpc.l"
# gRPC-over-HTTP/2 wire format and status mapping, shared by client and server.
"Grpc.Wire"       = "src/wire.l"
# Pure-Lyric client over Std.HttpEngine.H2Client (docs/72 slice 6).
"Grpc.Client"     = "src/client.l"
# Pub aspect templates for cross-cutting gRPC handler concerns.
"Grpc.Aspects"    = "src/aspects.l"
# .NET kernel: Grpc.Net.Client / Grpc.Core.Api client.
"Grpc.Kernel.Net" = "src/_kernel/net/grpc_kernel.l"
# .NET server: pure-Lyric h2c gRPC server over Std.TcpHost + Std.HttpEngine.H2Conn.
"Grpc.Kernel.Net.Server" = "src/_kernel/net/grpc_server.l"
# JVM kernel: grpc-java client.
"Grpc.Kernel.Jvm" = "src/_kernel/jvm/grpc_kernel.l"

[project.tests]
"Grpc.GrpcTypesTests" = "tests/grpc_types_tests.l"
"Grpc.SecurityAspectWeavingTests" = "tests/security_aspect_weaving_tests.l"
"Grpc.RateLimitTests" = "tests/rate_limit_tests.l"
"Grpc.ChannelLifecycleTests" = "tests/channel_lifecycle_tests.l"
"Grpc.ClientDotnetTests" = "tests/client_dotnet_tests.l"
"Grpc.ClientJvmTests" = "tests/client_jvm_tests.l"
"Grpc.ServerTests" = "tests/server_tests.l"
"Grpc.ServerDotnetTests" = "tests/server_dotnet_tests.l"
"Grpc.RateLimitJvmTests" = "tests/rate_limit_jvm_tests.l"
"Grpc.WireTests" = "tests/wire_tests.l"
"Grpc.ClientH2Tests" = "tests/client_h2_tests.l"

[dependencies]
"Lyric.Auth"       = { workspace = true }
"Lyric.Resilience" = { workspace = true }

[nuget]
# Client: Grpc.Net.Client ships with .NET 5+ but the NuGet package pins a
# specific version and pulls in Grpc.Core.Api for CallInvoker abstractions.
"Grpc.Net.Client" = "2.65.0"
# Server: grpc-dotnet is part of the ASP.NET Core SDK from .NET 6+.
"Grpc.AspNetCore" = "2.65.0"
# System.Threading.RateLimiting ships in the ASP.NET Core shared framework
# (Microsoft.AspNetCore.App), not the base runtime — the auto-FFI resolver
# only scans NuGet-restored package assemblies plus the base runtime ref
# pack, not the ASP.NET Core one, so RateLimitLease (never directly
# constructed, only ever a member return/parameter type) resolved against
# the wrong assembly and threw System.TypeLoadException at runtime. An
# explicit NuGet reference to the standalone package sidesteps the shared-
# framework ambiguity entirely.
"System.Threading.RateLimiting" = "8.0.0"

[maven]
"io.grpc:grpc-netty-shaded" = "1.65.0"
"io.grpc:grpc-protobuf"     = "1.65.0"
"io.grpc:grpc-stub"         = "1.65.0"
