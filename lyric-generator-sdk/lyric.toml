# lyric-generator-sdk - the SourceGenerator plugin point for Lyric custom
# source generators.
#
# Generator authors depend on this package for the GeneratorRequest /
# GeneratorResponse types, the SourceGenerator point and the ProjectRead
# capability; a generator is a @plugin record implementing SourceGenerator.
#
# See docs/40-source-generators.md, docs/69-plugins.md, D075 and D207.

[package]
name        = "Lyric.GeneratorSdk"
version     = "2.0.0"
description = "The SourceGenerator plugin point for Lyric custom source generators."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[project]
name            = "Lyric.GeneratorSdk"
output          = "single"
output_assembly = "Lyric.GeneratorSdk.dll"

[project.packages]
"Lyric.GeneratorSdk" = "src/generator_sdk.l"

[project.tests]
"Lyric.GeneratorSdk.Tests" = "tests/generator_sdk_tests.l"

# The SDK is pure Lyric over Std.* and has no target-specific code; the
# features exist so the target-selection flags CI passes (see
# scripts/ci/jvm-ecosystem-suites.sh) are checked against a declared set.
[features]
default = ["dotnet"]
dotnet  = []
jvm     = []

