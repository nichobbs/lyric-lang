[package]
name        = "Lyric.Session"
version     = "0.1.0"
stability = "stable"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Session management interface, in-process store and cookie configuration for Lyric web applications."
targets     = ["dotnet", "jvm", "native"]

[project]
name            = "Lyric.Session"
output          = "single"
output_assembly = "Session.dll"

[project.packages]
"Session" = "src/session.l"

# Full session test suite.  Runs via `lyric test --manifest` (#465).
# - session_fixation_tests.l    — no-auto-create invariant in set() (#316/#436)
# - session_store_tests.l       — full CRUD surface (create/load/get/set/delete/clear/touch/destroy)
# - sensitive_url_tests.l       — InProcessSessionStore credential-masking defensive checks (#357/#477)
#                                  and the pure `maskUrlCredentials` rewriter.
# - session_cookie_tests.l      — SessionConfig / sessionConfigFromEnv() / cookieHeader() secure
#                                  cookie defaults (Secure/HttpOnly/SameSite/Path=/).
# - session_config_env_tests.l  — parseSessionTtlSeconds bounds.
# - session_concurrency_*_tests.l — InProcessSessionStore under real threads (dotnet / jvm).
[project.tests]
"Session.SessionFixationTests"    = "tests/session_fixation_tests.l"
"Session.SessionStoreTests"       = "tests/session_store_tests.l"
"Session.SensitiveUrlTests"       = "tests/sensitive_url_tests.l"
"Session.SessionCookieTests"      = "tests/session_cookie_tests.l"
"Session.SessionConfigEnvTests"   = "tests/session_config_env_tests.l"
"Session.SessionConcurrencyDotnetTests" = "tests/session_concurrency_dotnet_tests.l"
"Session.SessionConcurrencyJvmTests" = "tests/session_concurrency_jvm_tests.l"
