# Doubles a thousand integers on the GPU and checks every one (docs/67 G5).
[package]
name    = "Lyric.Gpu.Examples.Compute"
version = "0.1.0"

[project]
name = "Lyric.Gpu.Examples.Compute"

[project.packages]
"Gpu.Examples.Compute" = "src/main.l"

[dependencies]
"Lyric.Gpu" = { path = "../.." }

# A macOS build also writes a .app bundle that carries the wgpu-native dylib (docs/67 G9, D233).
[native.app]
identifier = "org.lyric.examples.compute"
