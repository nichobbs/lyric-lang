# Draws a triangle offscreen and compares the pixels to a golden image (docs/67 G5).
[package]
name    = "Lyric.Gpu.Examples.Triangle"
version = "0.1.0"

[project]
name = "Lyric.Gpu.Examples.Triangle"

[project.packages]
"Gpu.Examples.Triangle" = "src/main.l"

[dependencies]
"Lyric.Gpu" = { path = "../.." }

# A macOS build also writes a .app bundle that carries the wgpu-native dylib (docs/67 G9, D233).
[native.app]
identifier = "org.lyric.examples.triangle"
