# Draws a triangle into an SDL3 window through a wgpu surface (docs/67 G4 + G5).  Needs a window
# system: CI runs it on an X11 server (Xvfb) with lavapipe.
[package]
name    = "Lyric.Gpu.Examples.Window"
version = "0.1.0"

[project]
name = "Lyric.Gpu.Examples.Window"

[project.packages]
"Gpu.Examples.Window" = "src/main.l"

[dependencies]
"Lyric.GpuWindow" = { path = "../../../lyric-gpu-window" }
"Lyric.Gpu"    = { path = "../.." }
"Lyric.Window" = { path = "../../../lyric-window" }

# A macOS build also writes a .app bundle that carries the wgpu-native dylib (docs/67 G9, D233).
[native.app]
identifier = "org.lyric.examples.window"
