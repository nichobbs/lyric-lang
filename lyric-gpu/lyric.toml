# lyric-gpu - GPU rendering and compute for --target native on WebGPU (docs/67 phase G5).
#
#   Gpu.Kernel.Wgpu  generated by `lyric bindgen` from the WebGPU C API (webgpu.h and
#                    wgpu-native's wgpu.h); never edited by hand.
#   Gpu              the safe Lyric surface over it.
#
# The library is wgpu-native v29.0.1.1.  A native build links it from the archive below,
# which `lyric restore` fetches and verifies against the pinned SHA-256; the archive is
# the wgpu 0.32.0 wheel for the platform, whose zip carries the wgpu-native shared
# library built for that release.

[package]
name        = "Lyric.Gpu"
version     = "0.1.0"
description = "WebGPU rendering and compute on wgpu-native for --target native."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[project]
name            = "Lyric.Gpu"
output          = "single"
output_assembly = "Lyric.Gpu.dll"

[project.packages]
"Gpu.Kernel.Wgpu" = "src/_kernel/wgpu.l"
"Gpu"             = "src/gpu.l"

[native.libs.wgpu_native-release.prebuilt.x86_64-unknown-linux-gnu]
url     = "https://files.pythonhosted.org/packages/99/a9/8b00e9d0cbd1ec0766e5b3c8063e61f0335262afe07cef82c307899bcf01/wgpu-0.32.0-py3-none-manylinux_2_28_x86_64.whl"
sha256  = "6499a31b5a29a10b4f1089fea4a0806411f42605fa86b6c0b543a07ca0de8568"
members = ["wgpu/resources/libwgpu_native-release.so"]

[native.libs.wgpu_native-release.prebuilt.aarch64-unknown-linux-gnu]
url     = "https://files.pythonhosted.org/packages/40/52/36819230b805b07fc4c3e92242aba7b73a0ce25e03b124992af79a6b1d4d/wgpu-0.32.0-py3-none-manylinux_2_28_aarch64.whl"
sha256  = "00454ba1bc794d38c8365f4ad29f381b88ce0a7f115133bfaa6f1dfad7eb2764"
members = ["wgpu/resources/libwgpu_native-release.so"]

[native.libs.wgpu_native-release.prebuilt.aarch64-apple-darwin]
url     = "https://files.pythonhosted.org/packages/d7/3b/a21ac5d2c5fcc13c2709123f497f5e008726221c56dc83ba0850fc2d230d/wgpu-0.32.0-py3-none-macosx_11_0_arm64.whl"
sha256  = "6c3f654ea01ab2de8a2903354ced02a3c6ef161d0fba1aa4fea60aa86d021908"
members = ["wgpu/resources/libwgpu_native-release.dylib"]

[native.libs.wgpu_native-release.prebuilt.x86_64-apple-darwin]
url     = "https://files.pythonhosted.org/packages/1b/4b/173e7685a22edf2d33ed330a038c8859d2c62bff900eb637a702661333ff/wgpu-0.32.0-py3-none-macosx_10_9_x86_64.whl"
sha256  = "cfd3967616a3c42e2b7a234407df38668c697f5aa505d56e0814d647b6746302"
members = ["wgpu/resources/libwgpu_native-release.dylib"]

# Windows: wgpu-native's own release archive.  The import library is extracted under the
# library's link name; it still loads wgpu_native.dll, which ships beside the program.
[native.libs.wgpu_native-release.prebuilt.x86_64-pc-windows-msvc]
url     = "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-windows-x86_64-msvc-release.zip"
sha256  = "7e67d7445c42aeb85e30f88930fd8d7d83ee769e3390aeb1ada75ebf3cf78132"
members = ["lib/wgpu_native.dll", "lib/wgpu_native.dll.lib -> wgpu_native-release.lib"]
