# lyric-lambda — AWS Lambda runtime adapter for Lyric.
#
# Ships nine packages:
#   Lambda                 — core types (LambdaContext, LambdaError, LambdaApp
#                            builder), the Lambda.Direct handler interfaces,
#                            and the serve() entry point.
#   Lambda.ApiGw           — API Gateway v1 / v2 / ALB event types; the
#                            typed bridge from HTTP events to Web.Router dispatch.
#   Lambda.Events          — non-HTTP event types: SQS, SNS, S3, EventBridge,
#                            DynamoDB Streams, Kinesis Data Streams.
#   Lambda.Authorizer      — authorizer event types and response helpers:
#                            TOKEN / REQUEST (REST API IAM policy) and
#                            HTTP API (v2) simple isAuthorized response.
#   Lambda.Direct          — AOT-compatible handler registration via typed
#                            interfaces (for PublishAot=true builds, and
#                            currently the only dispatch path that works).
#   Lambda.Dispatch        — event-source detection, JSON marshalling, and
#                            the aws/local transport loops (pure Lyric,
#                            no FFI) shared by Lambda.Kernel.Runtime's aws
#                            and local feature variants.
#   Lambda.Stream          — response streaming: StreamWriter type and helpers
#                            for Lambda Function URL / HTTP API streaming.
#                            Not implemented (no working transport).
#   Lambda.Aspects         — pub aspect templates: EventLogging, DeadlineGuard.
#   Lambda.Kernel.Runtime  — extern boundary to the Lambda runtime loop.
#                            Exactly one file is compiled per build; all
#                            three feature variants are thin wrappers over
#                            Lambda.Dispatch's HTTP long-polling loop
#                            against $AWS_LAMBDA_RUNTIME_API — aws and jvm
#                            target the real Runtime API (jvm deploys as a
#                            provided.al2/provided.al2023 custom runtime,
#                            not the managed java21 runtime; see
#                            _kernel/lambda_kernel_jvm.l), local targets a
#                            Std.HttpServer test-server transport instead.
#
# Feature flags:
#   aws, local, jvm  — runtime target (exactly one should be active per build).
#   web              — enables Lambda.withRouter() for lyric-web Router integration.
#                      Consumers must also declare Lyric.Web in their [dependencies].
#                      The LambdaRouter <-> Web.Router registry is real (see
#                      Lambda.Kernel.WebBridge); routing an API Gateway/ALB
#                      event through the resolved router is separate,
#                      larger work not done yet (Lambda.Dispatch's header).
#
# Composition modes (may be combined in the same LambdaApp):
#   1. lyric-web router reuse — attach a Web.Router with Lambda.withRouter().
#      The router-token registry works (Lambda.Kernel.WebBridge); actually
#      routing an API Gateway/ALB event through it does not yet (see
#      Lambda.Dispatch's header comment).
#   2. Streaming HTTP handler — Lambda.withStreamingHandler(handlerName).
#      Not implemented — see Lambda.Stream.
#   3. Custom event handlers — onSqs / onSns / onS3 / onEventBridge /
#      onDynamoDb / onKinesis / onRaw (string-based). Registration succeeds
#      but dispatch never resolves these (D099 rejects the reflection design
#      this implied) — use Lambda.Direct instead.
#   4. Authorizer handlers — onTokenAuthorizer / onRequestAuthorizer / onHttpAuthorizer.
#      Same caveat as #3 — use Lambda.Direct.*AuthorizerHandler instead.
#   5. Lambda.Direct handlers — Lambda.withDirect(Lambda.Direct.*Handler(impl)).
#      The only dispatch path that actually invokes a handler today; aws:sqs,
#      raw, and all three authorizer types are wired, the rest fail closed
#      with InternalError (see Lambda.Dispatch's header comment).
#
# See docs/35-lambda-library.md and decision logs D062, D063, D064, D099.

[package]
name        = "Lyric.Lambda"
version     = "0.1.0"
description = "AWS Lambda runtime adapter with API Gateway → lyric-web bridge, typed event sources, authorizers, streaming, and AOT support."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[features]
# .NET production: HTTP long-polling custom runtime loop (Lambda.Dispatch).
aws   = []
# Local development: lightweight HTTP test server (no AWS credentials needed).
local = []
# JVM production: HTTP long-polling custom runtime loop (Lambda.Dispatch),
# deployed as a provided.al2/provided.al2023 custom runtime — same protocol
# as `aws`, not the managed java21 runtime's RequestStreamHandler. No Maven
# dependency needed (see _kernel/lambda_kernel_jvm.l's header comment).
jvm   = []
# lyric-web router integration (withRouter).  Requires Lyric.Web as a dep.
web   = []

[project]
name            = "Lyric.Lambda"
output          = "single"
output_assembly = "Lambda.dll"

[project.packages]
# Core types, LambdaApp builder, serve() entry point, and (when feature = "web")
# withRouter() for lyric-web Router integration.
"Lambda"               = "src/lambda.l"
# API Gateway v1 / v2 / ALB event types and lyric-web bridge.
"Lambda.ApiGw"         = "src/apigw.l"
# Non-HTTP event types: SQS, SNS, S3, EventBridge, DynamoDB Streams, Kinesis.
"Lambda.Events"        = "src/events.l"
# Authorizer event types and response helpers (TOKEN, REQUEST, HTTP API v2).
"Lambda.Authorizer"    = "src/authorizer.l"
# AOT-compatible handler registration via function references.
"Lambda.Direct"        = "src/direct.l"
# Response streaming support (StreamWriter, write, close).
"Lambda.Stream"        = "src/stream.l"
# Pub aspect templates for cross-cutting Lambda handler concerns.
"Lambda.Aspects"       = "src/lambda_aspects.l"
# Event-source detection, JSON marshalling, and the aws/local transport
# loops shared by both Lambda.Kernel.Runtime feature variants.
"Lambda.Dispatch"      = "src/dispatch.l"
# Extern boundary — exactly one file is compiled per build (selected by feature):
#   aws   → thin wrapper over Lambda.Dispatch's HTTP long-polling loop
#   local → thin wrapper over Lambda.Dispatch's Std.HttpServer test server
#   jvm   → thin wrapper over the SAME Lambda.Dispatch HTTP long-polling
#           loop as aws, deployed as a custom runtime (see that file's
#           header comment for the deployment-model decision)
"Lambda.Kernel.Runtime" = [
  "src/_kernel/lambda_kernel_aws.l",
  "src/_kernel/lambda_kernel_local.l",
  "src/_kernel/lambda_kernel_jvm.l",
]
# Web bridge (compiled only when feature = "web"): real Lyric-level
# ConditionalWeakTable<LambdaRouter, Web.Router> registry (extern type +
# @externInstance Add/TryGetValue), no F#/host shim.
"Lambda.Kernel.WebBridge" = "src/_kernel/lambda_kernel_web.l"

[project.tests]
"Lambda.LambdaTests" = "tests/lambda_tests.l"
"Lambda.DispatchTests" = "tests/lambda_dispatch_tests.l"
# tests/lambda_webbridge_tests.l (needs --features web) and
# tests/lambda_runtime_loop_tests.l (needs --target jvm --features jvm)
# are real, complete, manually-verified tests deliberately NOT registered
# here: this manifest's [project.tests] entries all run together under
# whatever single --features/--target combination a `lyric test` invocation
# picks, and there is currently no way to opt one entry out of a build
# where it doesn't apply without hitting #6868 (a lyric test / @cfg
# interaction bug found while trying) -- see each file's own header
# comment for the manual-run recipe and the full explanation.

[dependencies]
"Lyric.Web"    = { workspace = true }

# No [nuget] table: the aws feature previously declared Amazon.Lambda.RuntimeSupport
# / Amazon.Lambda.Serialization.SystemTextJson for an extern package that was never
# implemented. Lambda.Dispatch's HTTP long-polling loop needs no NuGet dependency —
# it is pure Lyric over the already-real Std.Http client.

# No [maven] table either: the jvm feature previously declared
# com.amazonaws:aws-lambda-java-core / aws-lambda-java-events for the AWS
# Java *managed*-runtime entry point (a RequestStreamHandler class the
# platform reflectively instantiates). That design was not chosen (see
# src/_kernel/lambda_kernel_jvm.l's header comment) — the jvm feature now
# reuses Lambda.Dispatch's pure-Lyric-over-Std.Http custom-runtime loop,
# deployed as a provided.al2/provided.al2023 custom runtime, which needs no
# AWS Lambda Java SDK at all.
