# Ui.Plugins.Build — builders for a lyric-ui widget plugin's view
# (docs/65 §6.5, D230): the Ui.Widgets builders, producing Ui.Plugins
# WidgetTree values with message strings in place of messages.
#
# A widget plugin depends on it beside Ui.Plugins:
#
#   [dependencies]
#   "Ui.Plugins"       = { path = "../lyric-ui/plugins" }
#   "Ui.Plugins.Build" = { path = "../lyric-ui/plugins/build" }
#
# It is a library of its own so that the host side (Lyric.Ui, which depends
# on Ui.Plugins) does not carry functions named like Ui.Widgets'.  Its tests
# also cover the codecs Lyric.PluginExpand generates in Ui.Plugins.

[package]
name        = "Ui.Plugins.Build"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Builders for the view a lyric-ui widget plugin returns."

[project]
name            = "Ui.Plugins.Build"
output          = "single"
output_assembly = "Ui.Plugins.Build.dll"

[project.packages]
"Ui.Plugins.Build" = "src/build.l"

[project.tests]
"Ui.Plugins.Build.Tests" = "tests/build_tests.l"

[dependencies]
"Ui.Plugins" = { path = ".." }

[features]
default = ["dotnet"]
dotnet  = []
jvm     = []
native  = []
