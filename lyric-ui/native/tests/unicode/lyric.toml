# Unicode's own conformance suites for the native lyric-ui core's text algorithms (#8498).
#
#   BidiCharacterTest.txt  UAX #9, Unicode 15.1.0 (ucd/BidiCharacterTest.txt)
#   LineBreakTest.txt      UAX #14, Unicode 15.1.0 (ucd/auxiliary/LineBreakTest.txt)
#
# Both are vendored unchanged under the Unicode licence (LICENSE-UNICODE.txt) and pinned by SHA-256 in
# conformance.l.  `lyric test --manifest lyric-ui/native/tests/unicode/lyric.toml` runs them on dotnet
# (and with --target jvm on the JVM); `lyric build --target native` builds main.l, which runs them on
# the native backend.
[package]
name    = "Lyric.Ui.Native.UnicodeConformance"
version = "0.1.0"
license = "Apache-2.0"

[project]
name = "Lyric.Ui.Native.UnicodeConformance"

[project.packages]
"Ui.Native.UnicodeConformance"      = "conformance.l"
"Ui.Native.UnicodeConformance.Main" = "main.l"

[project.tests]
"Ui.Native.UnicodeConformanceTests" = "conformance_tests.l"

[dependencies]
"Lyric.Ui.Native.Core" = { path = "../.." }
