[package]
name        = "Lyric.Ui"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Model-view-update UI library for Lyric: semantic widgets, view diffing, and server-driven sessions (docs/65)."

[project]
name            = "Lyric.Ui"
output          = "single"
output_assembly = "Ui.dll"

[dependencies]
"Lyric.Forms"   = { workspace = true }
"Lyric.Web"     = { workspace = true }
"Lyric.Ws"      = { workspace = true }

[project.packages]
"Ui.Core"     = "src/core.l"
"Ui.Widgets"  = "src/widgets.l"
"Ui.Diff"     = "src/diff.l"
"Ui.Protocol" = "src/protocol.l"
"Ui.Session"  = "src/session.l"
"Ui.Testing"  = "src/testing.l"
"Ui.Forms"    = "src/forms_view.l"
"Ui.Routing"  = "src/routing.l"
"Ui.Html"     = "src/html.l"
"Ui.Grid"     = "src/grid.l"
"Ui.Host"        = "src/host.l"
"Ui.Host.Assets" = "src/host_assets.l"
"Ui.Host.Web"    = "src/host_web.l"
"Ui.Kernel.Webview" = "src/_kernel/webview.l"
# Ui.Kernel.Guard is one package in two files: the managed targets catch a
# panicking effect, native (no unwinding) runs it directly.
"Ui.Kernel.Guard" = [
  "src/_kernel/guard_managed.l",
  "src/_kernel/guard_native.l",
]
"Ui.Host.Desktop"   = "src/host_desktop.l"

[project.tests]
"Ui.CoreTests"     = "tests/core_tests.l"
"Ui.DiffTests"     = "tests/diff_tests.l"
"Ui.ProtocolTests" = "tests/protocol_tests.l"
"Ui.SessionTests"  = "tests/session_tests.l"
"Ui.HostTests"     = "tests/host_tests.l"
"Ui.RoutingTests"  = "tests/routing_tests.l"
"Ui.HtmlTests"     = "tests/html_tests.l"
"Ui.LazyTests"     = "tests/lazy_tests.l"
"Ui.GridTests"     = "tests/grid_tests.l"
"Ui.DesktopTests"  = "tests/desktop_tests.l"

[features]
default = ["dotnet"]
dotnet = []   # panics in effects are caught (Ui.Kernel.Guard)
jvm    = []
native = []   # no unwinding: an effect runs unguarded
