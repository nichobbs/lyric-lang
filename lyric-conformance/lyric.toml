[package]
name        = "Lyric.Conformance"
version     = "0.1.0"
stability = "stable"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Conformance suites for the Lyric library interfaces (cache, flags, session, message queue, storage, jobs, search)."

[project]
name            = "Lyric.Conformance"
output          = "single"
output_assembly = "Conformance.dll"

# The package depends only on the interface packages, each of which builds for
# every target, so a backend can run its suite wherever it runs itself
# (docs/decisions/D604).  The mocks, which also need lyric-db and lyric-mail,
# are in lyric-testing.
[project.packages]
"Testing.Conformance" = "src/core.l"
# Testing.Conformance.Guard is one package in two files: the managed targets
# catch a panicking case, native (no unwinding) runs it directly.
"Testing.Conformance.Guard" = [
  "src/guard_managed.l",
  "src/guard_native.l",
]
"Testing.Conformance.Cache" = "src/cache.l"
"Testing.Conformance.Flags" = "src/flags.l"
"Testing.Conformance.Session" = "src/session.l"
"Testing.Conformance.Mq" = "src/mq.l"
"Testing.Conformance.Storage" = "src/storage.l"
"Testing.Conformance.Jobs" = "src/jobs.l"
"Testing.Conformance.Search" = "src/search.l"

[project.tests]
"Testing.Conformance.SelfTests" = "tests/conformance_tests.l"

[dependencies]
"Lyric.Cache"    = { workspace = true }
"Lyric.Storage"  = { workspace = true }
"Lyric.Mq"       = { workspace = true }
"Lyric.Session"  = { workspace = true }
"Lyric.Flags"    = { workspace = true }
"Lyric.Jobs"     = { workspace = true }
"Lyric.Search"   = { workspace = true }
