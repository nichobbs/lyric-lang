# lyric-text - font loading, shaping, glyph rasterisation and line layout for --target native on
# FreeType and HarfBuzz (docs/67 phase G6).
#
#   Text.Kernel.Freetype   generated by `lyric bindgen` from FreeType; never edited by hand.
#   Text.Kernel.Harfbuzz   generated by `lyric bindgen` from HarfBuzz and its FreeType bridge.
#
# FreeType's records use C `long`, which is 32 bits on Windows, so both kernels are generated twice:
# <name>.l (LP64) and <name>_windows.l (LLP64), each gated by `@cfg(target_os = ...)`.
#   Text                   the safe Lyric surface over them.
#
# Both libraries are found with pkg-config (`freetype2`, `harfbuzz`): `libfreetype-dev` and
# `libharfbuzz-dev` on Debian and Ubuntu, `freetype` and `harfbuzz` in Homebrew.

[package]
name        = "Lyric.Text"
version     = "0.1.0"
description = "FreeType and HarfBuzz text shaping, rasterising and layout for --target native."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[project]
name            = "Lyric.Text"
output          = "single"
output_assembly = "Lyric.Text.dll"

[project.packages]
"Text.Kernel.Freetype" = ["src/_kernel/freetype.l", "src/_kernel/freetype_windows.l"]
"Text.Kernel.Harfbuzz" = ["src/_kernel/harfbuzz.l", "src/_kernel/harfbuzz_windows.l"]
"Text"                 = "src/text.l"

[native.libs.freetype]
version    = "2.10.0"
pkg_config = "freetype2"

[native.libs.harfbuzz]
version    = "2.7.0"
pkg_config = "harfbuzz"
