# Shapes, rasterises and lays out Latin, Arabic and CJK text and checks the results (docs/67 G6).
[package]
name    = "Lyric.Text.Examples.Shape"
version = "0.1.0"

[project]
name = "Lyric.Text.Examples.Shape"

[project.packages]
"Text.Examples.Shape" = "src/main.l"

[dependencies]
"Lyric.Text" = { path = "../.." }

# A macOS build also writes a .app bundle that carries the wgpu-native dylib (docs/67 G9, D233).
[native.app]
identifier = "org.lyric.examples.shape"
