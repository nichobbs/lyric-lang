[package]
name        = "Lyric.Testing"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Test helpers and mock implementations for Lyric libraries."

[project]
name            = "Lyric.Testing"
output          = "single"
output_assembly = "Testing.dll"

[project.packages]
"Testing" = "src/testing.l"
"Testing.Conformance" = "src/conformance/core.l"
"Testing.Conformance.Cache" = "src/conformance/cache.l"
"Testing.Conformance.Flags" = "src/conformance/flags.l"
"Testing.Conformance.Session" = "src/conformance/session.l"
"Testing.Conformance.Mq" = "src/conformance/mq.l"
"Testing.Conformance.Storage" = "src/conformance/storage.l"
"Testing.Conformance.Jobs" = "src/conformance/jobs.l"
"Testing.Conformance.Search" = "src/conformance/search.l"

[project.tests]
"Testing.TestingTests" = "tests/testing_tests.l"
"Testing.ConformanceTests" = "tests/conformance_tests.l"

[dependencies]
"Lyric.Cache"    = { workspace = true }
"Lyric.Mail"     = { workspace = true }
"Lyric.Storage"  = { workspace = true }
"Lyric.Mq"       = { workspace = true }
"Lyric.Session"  = { workspace = true }
"Lyric.Flags"    = { workspace = true }
"Lyric.Db"       = { workspace = true }
"Lyric.Jobs"     = { workspace = true }
"Lyric.Search"   = { workspace = true }
"Lyric.I18n"     = { workspace = true }
