[package]
name        = "Lyric.Testing"
version     = "0.1.0"
stability = "stable"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Test helpers and mock implementations for Lyric libraries."
# dotnet and the JVM. Native: the mocks cover lyric-db and lyric-mail, which
# have no native backend. The JVM build once failed with J002 in
# MockMessageQueue (an inherited interface clause naming `allHaveIds` has no
# checker site in this package), fixed in D609. The conformance suites are in
# lyric-conformance, which builds for every target (D604).
targets     = ["dotnet", "jvm"]

[project]
name            = "Lyric.Testing"
output          = "single"
output_assembly = "Testing.dll"

[project.packages]
"Testing" = "src/testing.l"

[project.tests]
"Testing.TestingTests" = "tests/testing_tests.l"
"Testing.ConformanceTests" = "tests/conformance_tests.l"

# The conformance suites (`Testing.Conformance.*`) are the `Lyric.Conformance`
# package (lyric-conformance/, docs/decisions/D604): this package's own
# conformance tests run them against the mocks.
[dependencies]
"Lyric.Conformance" = { workspace = true }
"Lyric.Cache"    = { workspace = true }
"Lyric.Mail"     = { workspace = true }
"Lyric.Storage"  = { workspace = true }
"Lyric.Mq"       = { workspace = true }
"Lyric.Session"  = { workspace = true }
"Lyric.Flags"    = { workspace = true }
"Lyric.Db"       = { workspace = true }
"Lyric.Jobs"     = { workspace = true }
"Lyric.Search"   = { workspace = true }
"Lyric.I18n"     = { workspace = true }
