# lyric-window - windows, input, clipboard, timing and audio for --target native on SDL3
# (docs/67 phase G4).
#
#   Window.Kernel.Sdl  generated by `lyric bindgen` from <SDL3/SDL.h>; never edited by hand.
#   Window             the safe Lyric surface over it.
#
# SDL3 is found with pkg-config (`sdl3`).  Install it from your distribution (Ubuntu 25.04
# and later, Fedora, Homebrew `sdl3`) or build the release tarball from libsdl.org, which is
# what CI does (scripts/ci/build-sdl3.sh, pinned by SHA-256).  On Windows `lyric restore`
# fetches the official development archive pinned below instead.

[package]
name        = "Lyric.Window"
version     = "0.1.0"
description = "SDL3 windows, input, clipboard, timing and audio for --target native."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[project]
name            = "Lyric.Window"
output          = "single"
output_assembly = "Lyric.Window.dll"

[project.packages]
"Window.Kernel.Sdl" = "src/_kernel/sdl.l"
"Window"            = "src/window.l"

[native.libs.SDL3]
version    = "3.2.0"
pkg_config = "sdl3"

# Windows has no pkg-config SDL3: the official Visual C++ development archive of the release
# CI builds on Linux (scripts/ci/build-sdl3.sh).
[native.libs.SDL3.prebuilt.x86_64-pc-windows-msvc]
url     = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip"
sha256  = "78d84602ae616cfe26b33a73b7d3b9b6b56e8a6650e53d92c9c6ca938f747acd"
members = ["SDL3-3.4.18/lib/x64/SDL3.dll", "SDL3-3.4.18/lib/x64/SDL3.lib"]
