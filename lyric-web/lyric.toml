# lyric-web — HTTP web service library for Lyric.
#
# Ships four packages:
#   Web                — Router/Request/Response/Middleware, static file
#                        serving, the HTTP server entry points, and runtime
#                        config blocks.  Built on Std.HttpServer, the shared
#                        pure-Lyric server driver, on every target (dotnet,
#                        jvm, native; docs/73 S6, D791).
#   Web.OpenApi        — OpenAPI 3.1 spec type vocabulary and code-first
#                        spec-builder.
#   Web.Aspects        — pub aspect templates: RequiresAuth, RequiresRole,
#                        ApiKey, RateLimit, HttpCircuitBreaker.
#   Web.Kernel.Runtime — the per-target kernel: rate limiter, background
#                        workers and request jobs, crash isolation, the
#                        WebSocket hand-over.  No HTTP server code.
#
# Both development workflows are supported:
#   Code-first:  populate a Web.OpenApi.Spec value, then either attach it
#                to a running server with Web.withSpec (serves live JSON +
#                Swagger UI, #5360) or render it to a file at build time
#                with Web.OpenApi.specToJson.
#   Spec-first:  run `lyric generate openapi spec.yaml` to produce
#                handler stubs + record types, then implement the bodies.
#
# See docs/26-aspects.md §18, docs/27-aspect-libraries.md,
# docs/58-wire-templates-sketch.md, D053, D124.

[package]
name        = "Lyric.Web"
version     = "0.1.0"
stability = "experimental"
description = "OpenAPI-first web service library with typed routing, runtime config, and aspect templates."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[features]
default = ["dotnet"]
# --target dotnet (Std.HttpServer over System.Net.Sockets).
dotnet = []
# The same server on --target jvm (Std.HttpServer over java.nio sockets; no Maven dependency of its own).
jvm    = []
# The same server on --target native.
native = []

[project]
name            = "Lyric.Web"
output          = "single"
output_assembly = "Web.dll"

[project.packages]
# Core types, router, config, server entry point.
"Web"             = "src/web.l"
# OpenAPI 3.1 spec vocabulary and code-first spec builder.
"Web.OpenApi"     = "src/openapi.l"
# Pub aspect templates for cross-cutting handler concerns.
"Web.Aspects"     = "src/aspects.l"
# Per-target kernel.  The rate limiter, worker loop, request jobs and the
# WebSocket hand-over are shared (web_kernel.l); exactly one prims file is
# compiled per build, selected by feature: net/ for dotnet and jvm (try/catch
# isolation), native/ for native (no unwinding, D-N-003).
"Web.Kernel.Runtime" = [
  "src/_kernel/net/web_kernel.l",
  "src/_kernel/net/web_prims.l",
  "src/_kernel/native/web_prims.l",
]

[project.tests]
"Web.CorsGuardTests"   = "tests/cors_guard_tests.l"
"Web.RateLimitTests"   = "tests/rate_limit_tests.l"
"Web.SecurityAspectWeavingTests" = "tests/security_aspect_weaving_tests.l"
"Web.DispatchTests"    = "tests/dispatch_tests.l"
"Web.ServeTlsTests"    = "tests/serve_tls_tests.l"
"Web.WebTlsConfigTests" = "tests/webtls_config_tests.l"
"Web.ServeCrashIsolationTests" = "tests/serve_crash_isolation_tests.l"
"Web.WorkerDispatchTests" = "tests/worker_dispatch_tests.l"
"Web.WebSocketTests"   = "tests/web_socket_tests.l"
"Web.ConcurrentDispatchTests" = "tests/concurrent_dispatch_tests.l"

[dependencies]
"Lyric.Auth"         = { workspace = true }
"Lyric.Resilience"   = { workspace = true }
# WebSocket endpoints on the router's own port (`Web.addWebSocket`, #7831).
"Lyric.Ws"           = { workspace = true }

[nuget]
# The dotnet HTTP server (Std.HttpServer over System.Net.Sockets) is part of
# the base class library; no extra package needed.
# Add if using OpenTelemetry integration:
# "OpenTelemetry.Extensions.Hosting" = "1.9.0"
