# lyric-access platform - publishes the native lyric-ui host's accessibility tree through AccessKit
# (docs/67 G10).
#
#   Access.Kernel.Accesskit  generated by `lyric bindgen` from AccessKit's C API (<accesskit.h> of
#                            accesskit-c 0.23.2); never edited by hand.  One file per platform, each
#                            gated by `@cfg(target_os = ...)`, since each platform has its own adapter.
#   Access.Platform          the adapter: sends `Access.Plan` plans to AccessKit and queues the
#                            requests assistive technologies make (AT-SPI on Linux, NSAccessibility
#                            on macOS, UI Automation on Windows)
#
# The library is accesskit-c 0.23.2.  `lyric restore` fetches the release archive below and checks it
# against the pinned SHA-256; it carries the shared library for Linux x86-64, macOS and Windows x86-64.
# Other targets (Linux arm64) find a source build with pkg-config (`accesskit`), which
# scripts/ci/build-accesskit.sh makes from the same archive.

[package]
name        = "Lyric.Access"
version     = "0.1.0"
description = "AccessKit adapters that publish the native lyric-ui host's accessibility tree, for --target native."
authors     = ["Lyric authors"]
license     = "Apache-2.0"

[project]
name            = "Lyric.Access"
output          = "single"
output_assembly = "Lyric.Access.dll"

[project.packages]
"Access.Kernel.Accesskit" = ["src/_kernel/accesskit_linux.l", "src/_kernel/accesskit_macos.l", "src/_kernel/accesskit_windows.l"]
"Access.Platform"         = "src/access.l"

[dependencies]
"Lyric.Access.Core"    = { path = ".." }
"Lyric.Ui.Native.Core" = { path = "../../lyric-ui/native" }
"Lyric.Window"         = { path = "../../lyric-window" }

[native.libs.accesskit]
pkg_config = "accesskit"

[native.libs.accesskit.prebuilt.x86_64-unknown-linux-gnu]
url     = "https://github.com/AccessKit/accesskit-c/releases/download/0.23.2/accesskit-c-0.23.2.zip"
sha256  = "c7fa84f8f34fca909f662375737a54f98b17cf9eae51fffd94ab3d9f662e3681"
members = ["accesskit-c-0.23.2/lib/linux/x86_64/shared/libaccesskit.so"]

[native.libs.accesskit.prebuilt.aarch64-apple-darwin]
url     = "https://github.com/AccessKit/accesskit-c/releases/download/0.23.2/accesskit-c-0.23.2.zip"
sha256  = "c7fa84f8f34fca909f662375737a54f98b17cf9eae51fffd94ab3d9f662e3681"
members = ["accesskit-c-0.23.2/lib/macos/arm64/shared/libaccesskit.dylib"]

[native.libs.accesskit.prebuilt.x86_64-apple-darwin]
url     = "https://github.com/AccessKit/accesskit-c/releases/download/0.23.2/accesskit-c-0.23.2.zip"
sha256  = "c7fa84f8f34fca909f662375737a54f98b17cf9eae51fffd94ab3d9f662e3681"
members = ["accesskit-c-0.23.2/lib/macos/x86_64/shared/libaccesskit.dylib"]

# The import library records the DLL it loads (accesskit.dll), which ships beside the program.
[native.libs.accesskit.prebuilt.x86_64-pc-windows-msvc]
url     = "https://github.com/AccessKit/accesskit-c/releases/download/0.23.2/accesskit-c-0.23.2.zip"
sha256  = "c7fa84f8f34fca909f662375737a54f98b17cf9eae51fffd94ab3d9f662e3681"
members = ["accesskit-c-0.23.2/lib/windows/x86_64/msvc/shared/accesskit.dll", "accesskit-c-0.23.2/lib/windows/x86_64/msvc/shared/accesskit.lib"]
