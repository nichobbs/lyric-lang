name: Native platforms

# The `--target native` suite on the hosts the Linux x86-64 lane in ci.yml does
# not cover: macOS arm64 and Linux arm64 (docs/67, #8419, #8401).  This is its
# own workflow, not jobs in ci.yml: ci.yml sits just under the soft size
# ceiling scripts/ci/check-workflow-size.sh enforces (#6387), the same reason
# windows-build.yml is separate.
#
# Like windows-build.yml, no Lyric seed ever runs on these hosts.  The
# self-hosted stage-2 compiler DLLs are managed IL (RID-independent), so the
# `managed` job builds them once on Linux x86-64 and each platform job
# NativeAOT-links them into a `lyric` for its own runtime identifier and runs
# scripts/ci/native-platform-tests.sh with it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-platforms.yml'
      - 'bootstrap/src/Lyric.Cli.Aot/**'
      - 'lyric-rt/**'
      - 'lyric-compiler/lyric/llvm_*.l'
      - 'lyric-compiler/lyric/emitter.l'
      - 'lyric-compiler/lyric/cli/**'
      - 'lyric-stdlib/std/_kernel_native/**'
      - 'lyric-stdlib/tests/async_echo_main.l'
      - 'scripts/ci/native-platform-tests.sh'
      - 'scripts/ci/macos-graphics-e2e.sh'
      - 'lyric-gpu/**'
      - 'lyric-gpu-window/**'
      - 'lyric-window/**'
      - 'lyric-game/**'
      - 'lyric-ui/native/**'
      - 'lyric-text/**'
      - 'lyric-unicode/**'
      - 'lyric-unicode-dict/**'
      - 'lyric-draw/**'
      - 'lyric-access/**'
      - 'benchmarks/**'
      - 'scripts/ci/build-sdl3.sh'
      - 'scripts/ci/text-examples-e2e.sh'
      - 'scripts/ci/draw-examples-e2e.sh'
      - 'scripts/ci/gpu-examples-e2e.sh'
      - 'scripts/ci/gpu-window-e2e.sh'
      - 'scripts/ci/window-examples-e2e.sh'
      - 'scripts/ci/game-examples-e2e.sh'
      - 'scripts/ci/ui-native-e2e.sh'
      - 'scripts/ci/build-accesskit.sh'
      - 'scripts/ci/atspi-smoke.py'
      - 'scripts/ci/access-platform-e2e.sh'
      - 'scripts/ci/parallel-e2e.sh'
      - 'scripts/ci/async-mt-e2e.sh'
      - 'scripts/ci/native-plugin-e2e.sh'
      - 'scripts/ci/async-io-e2e.sh'
      - 'scripts/ci/plugin-e2e.sh'
      - 'scripts/ci/plugin-protocol-e2e.sh'
      - 'scripts/ci/plugin-trusted-e2e.sh'
      - 'scripts/ci/ui-widget-plugins-e2e.sh'
      - 'scripts/ci/bench-vec3-alloc.sh'

permissions:
  contents: read

# A newer push supersedes the run in flight: macOS runners are scarce.
concurrency:
  group: native-platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The managed closure depends only on the compiler, stdlib and bootstrap
      # sources, not on lyric-rt or this lane's scripts, so a runtime or script
      # iteration reuses the previous build instead of repeating ~16 minutes.
      - name: Restore managed compiler closure
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: managed-out
          key: managed-stage2-${{ hashFiles('lyric-compiler/**', 'lyric-stdlib/**', 'bootstrap/**', 'scripts/bootstrap.sh') }}

      - name: Set up .NET
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: bootstrap/global.json

      - name: Set up Java 22 (for the Maven resolver jar)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '22'

      - name: Build stage 2 (self-hosted compiler)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bootstrap.sh --stage 3

      - name: Stage managed compiler closure
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p managed-out/lib
          cp .bootstrap/stage2/lib/Lyric.*.dll managed-out/lib/
          test -f managed-out/lib/Lyric.Stdlib.dll || { echo "::error::Lyric.Stdlib.dll missing from stage2"; exit 1; }

      - name: Upload managed compiler closure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: managed-stage2
          if-no-files-found: error
          retention-days: 7
          path: managed-out

  macos:
    needs: [managed]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: bootstrap/global.json

      - name: Set up Java 22
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '22'

      - name: Download managed compiler closure
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: managed-stage2
          path: managed

      - name: Publish self-contained AOT binary (osx-arm64)
        shell: bash
        working-directory: bootstrap
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/managed/lib"
          test -f "$STAGE/Lyric.Stdlib.dll" || { echo "::error::Lyric.Stdlib.dll not found in managed artifact"; exit 1; }
          dotnet publish src/Lyric.Cli.Aot/Lyric.Cli.Aot.csproj \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version=0.0.0-dryrun \
            -p:StageDir="$STAGE" \
            --output publish/osx-arm64
          out=publish/osx-arm64
          mkdir -p "$out/lib"
          cp "$STAGE"/Lyric.Stdlib*.dll "$out/lib/"
          file "$out/lyric"
          "$out/lyric" --version
          echo "LYRIC_BIN=$GITHUB_WORKSPACE/bootstrap/$out/lyric" >> "$GITHUB_ENV"

      # lyric-rt's TLS seam loads OpenSSL 3 at run time; macOS ships none.
      - name: Install OpenSSL 3
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Native suite (arm64-apple-darwin)
        shell: bash
        run: bash scripts/ci/native-platform-tests.sh

      # docs/67 G4: lyric-window on SDL3 built from the pinned tarball (Cocoa
      # video plus the headless drivers); the demo runs on the offscreen video
      # driver and the disk audio driver.
      - name: Install SDL3 build dependencies
        if: always()
        run: brew install pkgconf ninja

      - name: Cache SDL3
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-macos-${{ hashFiles('scripts/ci/build-sdl3.sh') }}

      - name: lyric-window on SDL3 (arm64-apple-darwin)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sdl3_prefix="$RUNNER_TEMP/sdl3"
          bash scripts/ci/build-sdl3.sh "$sdl3_prefix"
          LYRIC_BIN="$LYRIC_BIN" SDL3_PREFIX="$sdl3_prefix" bash scripts/ci/window-examples-e2e.sh

      # docs/67 G5 and G7 on macOS (D317).  A hosted macOS VM may expose no Metal
      # adapter, so the probe runs first and reports which it is; the steps after
      # it run only when it found one, and say so when it did not.
      - name: Install graphics dependencies (FreeType, HarfBuzz, DejaVu)
        if: always()
        run: |
          brew install freetype harfbuzz pkgconf
          brew install --cask font-dejavu

      - name: Metal adapter probe
        id: metal
        if: always()
        shell: bash
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/macos-graphics-e2e.sh probe

      - name: No Metal adapter on this runner
        if: always() && steps.metal.outputs.metal != 'true'
        run: echo "::warning::this macOS runner exposes no Metal adapter, so the GPU, window, Breakout and UI examples did not run here (see the probe step; #8563)"

      - name: lyric-gpu, Breakout and lyric-ui on Metal (arm64-apple-darwin)
        if: always() && steps.metal.outputs.metal == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdl3_prefix="$RUNNER_TEMP/sdl3"
          export PKG_CONFIG_PATH="$sdl3_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export DYLD_LIBRARY_PATH="$sdl3_prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/macos-graphics-e2e.sh run

      # #8563 items 4 and 5: the ThreadSanitizer and AddressSanitizer runs (Apple clang ships
      # both), the plugin runs with a native side (scripts/ci/native-plugin-e2e.sh; the
      # NativeAOT `lyric` builds the dotnet payloads and hosts itself), and the Vec3 allocation bench.
      - name: Std.Parallel under ThreadSanitizer (arm64-apple-darwin)
        if: always()
        shell: bash
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/parallel-e2e.sh

      - name: Multi-threaded async scheduler under ThreadSanitizer and AddressSanitizer (arm64-apple-darwin)
        if: always()
        shell: bash
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/async-mt-e2e.sh

      - name: Async I/O reactor, an echo server with 1000 idle connections (arm64-apple-darwin)
        if: always()
        shell: bash
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/async-io-e2e.sh

      - name: Plugins with a native host or plugin, dotnet sides included (arm64-apple-darwin)
        if: always()
        shell: bash
        run: bash scripts/ci/native-plugin-e2e.sh "$LYRIC_BIN"

      - name: Vec3 does not allocate (arm64-apple-darwin)
        if: always()
        shell: bash
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/bench-vec3-alloc.sh

      # docs/67 G10: lyric-access's kernel, request layout and NSAccessibility adapter on a Cocoa
      # window.  No macOS client reads the tree here: a hosted runner grants no Accessibility
      # permission (#8799).
      - name: lyric-access NSAccessibility adapter (arm64-apple-darwin)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/sdl3/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/sdl3/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/access-platform-e2e.sh

  linux-arm64:
    needs: [managed]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: bootstrap/global.json

      - name: Set up Java 22
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '22'

      - name: Download managed compiler closure
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: managed-stage2
          path: managed

      - name: Install the native AOT and test toolchain
        run: |
          set -euo pipefail
          bash scripts/ci/install-tool.sh aot-prereqs
          bash scripts/ci/install-tool.sh apt gcc libssl-dev
          clang --version

      - name: Publish self-contained AOT binary (linux-arm64)
        shell: bash
        working-directory: bootstrap
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/managed/lib"
          test -f "$STAGE/Lyric.Stdlib.dll" || { echo "::error::Lyric.Stdlib.dll not found in managed artifact"; exit 1; }
          dotnet publish src/Lyric.Cli.Aot/Lyric.Cli.Aot.csproj \
            --configuration Release \
            --runtime linux-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version=0.0.0-dryrun \
            -p:StageDir="$STAGE" \
            --output publish/linux-arm64
          out=publish/linux-arm64
          mkdir -p "$out/lib"
          cp "$STAGE"/Lyric.Stdlib*.dll "$out/lib/"
          file "$out/lyric"
          "$out/lyric" --version
          echo "LYRIC_BIN=$GITHUB_WORKSPACE/bootstrap/$out/lyric" >> "$GITHUB_ENV"

      - name: Native suite (aarch64-unknown-linux-gnu)
        shell: bash
        run: bash scripts/ci/native-platform-tests.sh

      # #8563: the graphics examples, as on Linux x86-64 (native-backend-self-tests.sh): wgpu-native's
      # pinned aarch64 prebuilt over lavapipe (mesa-vulkan-drivers), SDL3 built with its X11 driver for
      # the Xvfb window checks, FreeType/HarfBuzz and the DejaVu and WenQuanYi Zen Hei fonts.
      - name: Install graphics dependencies
        if: always()
        run: |
          set -euo pipefail
          bash scripts/ci/install-tool.sh apt cmake ninja-build pkgconf mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev fonts-dejavu-core fonts-wqy-zenhei \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxrender-dev libxtst-dev \
            xvfb x11-apps imagemagick xdotool

      - name: Cache SDL3
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-linux-arm64-x11-${{ hashFiles('scripts/ci/build-sdl3.sh') }}

      - name: Build SDL3 (X11 driver)
        if: always()
        run: bash scripts/ci/build-sdl3.sh --x11 "$RUNNER_TEMP/sdl3"

      - name: lyric-text on FreeType and HarfBuzz
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/text-examples-e2e.sh

      - name: lyric-gpu on wgpu-native over lavapipe
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/gpu-examples-e2e.sh

      - name: lyric-draw scene
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/draw-examples-e2e.sh

      - name: lyric-window on SDL3
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" SDL3_PREFIX="$RUNNER_TEMP/sdl3" bash scripts/ci/window-examples-e2e.sh

      - name: lyric-gpu window under Xvfb
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" SDL3_PREFIX="$RUNNER_TEMP/sdl3" bash scripts/ci/gpu-window-e2e.sh

      - name: Breakout (replay and X11 window)
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" SDL3_PREFIX="$RUNNER_TEMP/sdl3" bash scripts/ci/game-examples-e2e.sh

      # accesskit-c's release archive has no Linux arm64 library, so lyric-access links a source
      # build (scripts/ci/build-accesskit.sh --source, Rust from the runner image).
      - name: Cache AccessKit
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/accesskit
          key: accesskit-linux-arm64-${{ hashFiles('scripts/ci/build-accesskit.sh') }}

      - name: Native lyric-ui host
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" SDL3_PREFIX="$RUNNER_TEMP/sdl3" ACCESSKIT_PREFIX="$RUNNER_TEMP/accesskit" bash scripts/ci/ui-native-e2e.sh

      # #8563 items 4 and 5.  ThreadSanitizer maps shadow memory at fixed addresses, which a high
      # ASLR entropy setting can collide with; the step prints the value it found and lowers it
      # for the rest of the job, so the sanitizer and plugin steps stay last.
      - name: ThreadSanitizer prerequisites
        if: always()
        run: |
          set -euo pipefail
          clang --version
          echo "int main(void){return 0;}" > "$RUNNER_TEMP/tsan_preflight.c"
          if ! clang -fsanitize=thread "$RUNNER_TEMP/tsan_preflight.c" -o "$RUNNER_TEMP/tsan_preflight"; then
            bash scripts/ci/install-tool.sh apt "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
            clang -fsanitize=thread "$RUNNER_TEMP/tsan_preflight.c" -o "$RUNNER_TEMP/tsan_preflight"
          fi
          echo "vm.mmap_rnd_bits=$(cat /proc/sys/vm/mmap_rnd_bits)"
          sudo sysctl -w vm.mmap_rnd_bits=28
          "$RUNNER_TEMP/tsan_preflight"

      - name: Std.Parallel under ThreadSanitizer
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/parallel-e2e.sh

      - name: Multi-threaded async scheduler under ThreadSanitizer and AddressSanitizer
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/async-mt-e2e.sh

      - name: Async I/O reactor, an echo server with 1000 idle connections
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/async-io-e2e.sh

      - name: Plugins with a native host or plugin, dotnet sides included
        if: always()
        run: bash scripts/ci/native-plugin-e2e.sh "$LYRIC_BIN"

      - name: Vec3 does not allocate
        if: always()
        run: LYRIC_BIN="$LYRIC_BIN" bash scripts/ci/bench-vec3-alloc.sh
