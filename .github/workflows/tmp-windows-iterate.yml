name: tmp-windows-iterate
on:
  push:
    branches: [claude/relaxed-fermi-34von1]
    paths: ['.github/workflows/tmp-windows-iterate.yml', 'scripts/ci/windows-*.ps1', 'scripts/install.ps1']
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: bootstrap/global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: managed-stage2
          path: managed
          run-id: 40006887171
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build lyric.exe
        shell: bash
        working-directory: bootstrap
        run: |
          set -euo pipefail
          dotnet restore src/Lyric.Cli.Aot/Lyric.Cli.Aot.csproj --runtime win-x64
          STAGE="$GITHUB_WORKSPACE/managed/lib"
          dotnet publish src/Lyric.Cli.Aot/Lyric.Cli.Aot.csproj --configuration Release --runtime win-x64 \
            --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
            -p:Version=0.0.0-dryrun -p:StageDir="$(cygpath -m "$STAGE")" --output publish/win-x64 --no-restore
          mkdir -p publish/win-x64/lib
          cp "$STAGE"/Lyric.Stdlib*.dll publish/win-x64/lib/
          cp "$GITHUB_WORKSPACE/managed/lyric-resolver.jar" publish/win-x64/
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "bootstrap/publish/win-x64/*" -DestinationPath "lyric-0.0.0-dryrun-win-x64.zip"
      - name: Installer tests
        shell: pwsh
        run: ./scripts/ci/windows-installer-test.ps1 -Zip "$PWD/lyric-0.0.0-dryrun-win-x64.zip"
      - name: lyric test
        shell: pwsh
        run: ./scripts/ci/windows-lyric-test.ps1 -Lyric "$PWD/bootstrap/publish/win-x64"
