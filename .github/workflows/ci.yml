      - name: Interface default-method out/inout self-test on JVM (native lyric test --target jvm)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/jvm/iface_default_method_out_inout_jvm_self_test.l

