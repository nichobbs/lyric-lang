      # caught immediately.  Compiled in-process through the self-hosted
      # `Msil.Bridge`; imports only `Std.*`.
      - name: Generic closure-over-container self-test (native lyric test, #6569)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/generic_closure_container_self_test.l

      # Extra barrier (batch 2a-split, #5933): THIS group produced two of the
      # four observed exit-135 random step kills (cross_package_generics on
      # PR #5910's run, restored_async on PR #5909's) — the runner killed one
      # concurrent step mid-run with SIGBUS-class exit 135 and no diagnostic,
      # under the memory pressure of 10 simultaneous in-process compilations.
      # Split into 5 + 5. Per the header note: split, don't serialize.
      - name: Wait for parallel tests (batch 2a-split)
        wait-all: true

      # Cross-package generic records/unions self-test (#1496, D-progress-494).
      # Builds a PRODUCER DLL (generic record / union) in-process via
      # `Lyric.Emitter.emitProject`, then compiles a CONSUMER that imports the
      # producer as a restored dep and runs it.  Verifies that TypeRef names carry
      # the arity suffix, that generic metadata maps (genericTypeArity,
      # genericCtorParams, fieldSigBytes, fieldVarIndices) are populated from the
      # restored PackageDecl so that construction and field reads work without
      # runtime mismatches.  Six scenarios: Box[Int], Box[String], Pair[Int,String],
      # Maybe[Int] Just, Maybe[Int] Nothing, Maybe[String] Just.  Uses
      # `Lyric.Emitter` so LYRIC_LOAD_COMPILER=1 is needed.
      - name: Cross-package generics self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: LYRIC_LOAD_COMPILER=1 bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/cross_package_generics_self_test.l

      # Cross-package Nat-backed range-subtype self-test (docs/59 §3.3 MINOR
      # finding).  `typeExprToMsilCtx` had no arm for `Nat`, so a `Nat`-typed
      # (or `Nat range A..=B`-typed) parameter/return/field fell through to
      # `MClass("<pkg>.Nat")` — an in-package reference-type guess — instead
      # of its real `int64` representation.  Self-consistent within one
      # compilation unit, but a restored-package consumer decodes the real
      # `I8` signature from metadata and the two encodings diverge:
      # InvalidProgramException at the call site, the same failure shape as
      # the Web.Request crash.  Builds a PRODUCER DLL (a `Nat range` distinct
      # type used as a function parameter/return and as a record field) via
      # `Lyric.Emitter.emitProject`, then compiles a CONSUMER that imports it
      # as a restored dep and runs it.  Uses `Lyric.Emitter`, so
      # LYRIC_LOAD_COMPILER=1 is needed.
      - name: Cross-package Nat self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: LYRIC_LOAD_COMPILER=1 bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/nat_cross_package_self_test.l

      # Cross-assembly restored async funcs self-test (#5561).  Builds a
      # PRODUCER DLL of `pub async func`s in-process via
      # `Lyric.Emitter.emitProject`, then compiles a CONSUMER that awaits them
      # as a restored dep and runs it.  Verifies the consumer MemberRef
      # encodes the Task-wrapped kickoff return (asyncness derived from the
      # producer DLL's own MethodDef metadata — contract reprs don't carry
      # it) and that the caller-side await unwraps it, on both the blocking
      # shim (plain main) and the Phase-B state-machine paths.  Uses
      # `Lyric.Emitter`, so LYRIC_LOAD_COMPILER=1 is needed.
      - name: Restored async funcs self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: LYRIC_LOAD_COMPILER=1 bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/restored_async_self_test.l

      # Restored-dependency qualified `pub val` self-test (#6133/#5275).  A
      # QUALIFIED reference (`Pkg.NAME`) to a restored dep's literal-foldable
      # `pub val` now inlines correctly (a package-qualified `constValues`
      # key, mirroring `staticValTokens`'s in-bundle convention); a QUALIFIED
      # reference to a restored dep's NON-literal `pub val` now fails to
      # compile with `error[T0115]` instead of silently reading null/0 at
      # runtime.  Same two-stage PRODUCER/CONSUMER harness as the restored
      # async self-test above.  Uses `Lyric.Emitter`, so LYRIC_LOAD_COMPILER=1
      # is needed.
      - name: Restored-dependency qualified pub val self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: LYRIC_LOAD_COMPILER=1 bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/msil_restored_qualified_val_self_test.l

      - name: Wait for parallel tests (dotnet-a batch 9 split, #4975)
        wait-all: true

      # Restored-dependency List[slice[Byte]] return self-test (#5575
      # residual finding).  PR #6329's #6332 extension already fixed the
      # underlying array-signature degrade; this pins it specifically across
      # a genuine restored-DLL boundary (the shape #5575 is about), which
      # that PR's same-bundle-only regression coverage does not exercise.
      # Same two-stage PRODUCER/CONSUMER harness as the restored async
      # self-test above.  Uses `Lyric.Emitter`, so LYRIC_LOAD_COMPILER=1 is
      # needed.
      - name: Restored dependency List[slice[Byte]] return self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: LYRIC_LOAD_COMPILER=1 bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/restored_slice_list_return_self_test.l

      # Async extern unwrapping self-test — pins the Band 3 Phase A fix for the
      # @externTarget async silent miscompile (epic #2070, D085, D-progress-415).
      # Before this fix, @externTarget async func left Task<T> on the stack where
      # callers expected T.  Exercises both unwrap paths: the non-void path
      # (Task<T>::get_Result() via StringReader.ReadToEndAsync) and the void path
      # (Task::Wait() via Task.Delay(0)).  MSIL target only; JVM async (IAsyncEnumerable
      # synthesis) is Phase B and tracked in epic #2070.  Imports only Std.*, so
      # no LYRIC_LOAD_COMPILER=1 needed.
      - name: Async extern unwrapping self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/async_extern_self_test.l

      # IAsyncStateMachine synthesis self-test — pins Phase B.0 (epic #2070, D086):
      # user-defined `async func` without EAwait nodes synthesises a sealed
      # IAsyncStateMachine class.  Exercises non-void (Int, String), void (no-op,
      # local val), sequential calls, and explicit-return paths (#2256).
      # MSIL target only (JVM async is Phase B.1+).  Imports only `Std.*`.
      - name: Async SM synthesis self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/async_sm_self_test.l

      # Auto-FFI metadata-resolution self-test on the JVM target (epic #1622,
      # JVM analog).  `extern type T = "java.lang.Math"` makes `T.method(args)`
      # resolve to a real JVM static method: the self-hosted JVM emitter reads
      # the `.class` entry straight out of `java.base.jmod` (a ZIP of
      # DEFLATE-compressed class files) via the pure-Lyric Jvm.ZipReader /
      # Jvm.Deflate / Jvm.ClassReader stack, scores the overloads in
      # Jvm.AutoFfi, and emits the real `invokestatic owner.name(desc)` instead
      # of the legacy `([Object…])Object` guess.  Run via native
      # `lyric test --target jvm`, which compiles the @test_module in-process
      # through the self-hosted `Jvm.Bridge` (`compileToJarBundled`) and runs it
      # under `java` (Java 21 is configured above).  No new F#; imports only
      # `Std.*`, so no `LYRIC_LOAD_COMPILER=1`.
      # Concurrency cap: this second parallel group was 16 background steps and
      # also intermittently misreported a passing step as failed (Defer, etc.).
      # This barrier halves it to ~8 concurrent in-process compilations.
      - name: Wait for parallel tests (batch 2a)
        wait-all: true

      - name: Match/compound self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/match_compound_self_test.l

      # Loop-EH + collection self-test — pins the remaining two #1481 (epic
      # #1470, Band 2) backend fixes: (3) `break`/`continue` whose target loop
      # sits outside an enclosing `try` region now emit `leave` instead of an
      # unverifiable `br` across the protected-region boundary; (4) `List.contains`
      # / `List.removeAt` call the real `List<object>::Contains`/`RemoveAt` BCL
      # methods instead of the false/no-op stubs.  MSIL target only; JVM parity
      # under #1470's JVM-deferral note.  Imports only `Std.*`.
      - name: Loop-EH/collection self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/loop_eh_collection_self_test.l

      # Return-in-try self-test — pins the #1477 foundation (epic #1470, Band 2):
      # a `return` inside a `try`/`catch`/`finally` now routes through a function
      # epilogue via `leave` (running intervening `finally` handlers) instead of
      # emitting a bare `ret` out of a protected region (unverifiable IL ->
      # InvalidProgramException). MSIL target only; JVM parity under #1470's
      # JVM-deferral note. Imports only `Std.*`.
      - name: Return-in-try self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/return_in_try_self_test.l

      # Defer self-test — pins `defer`-at-scope-exit (#1477, epic #1470, Band 2):
      # `defer { D }` runs D on scope exit on every path (fall-off, early return,
      # break/continue, exception unwind), and multiple defers run in reverse
      # declaration order. Lowered as `try { rest } finally { D }`, reusing the
      # function-epilogue return lowering and the break/continue-`leave` lowering.
      # MSIL target only; JVM parity under #1470's JVM-deferral note. Imports
      # only `Std.*`.
      - name: Defer self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/defer_self_test.l

      - name: Wait for parallel tests (dotnet-a batch 10 split, #4975)
        wait-all: true

      # try/catch-as-value self-test — pins #1823 (epic #1470, Band 2): a
      # `try { … } catch … { … }` used as a value-producing expression now
      # stashes each branch value into a temp before the `leave` and reloads it
      # after the merge label, instead of discarding the value (which left a
      # non-void function emitting a bare `ret` → InvalidProgramException). Also
      # unblocks the `assertPanics` try/catch shape on the self-hosted backend.
      # MSIL target only; JVM parity under #1470's JVM-deferral note.
      - name: Try-catch-expr self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/try_catch_expr_self_test.l

      # Loop-invariant self-test — pins that a loop `invariant:` clause is
      # checked at runtime (the contract elaborator lowers it to `assert(inv)`
      # at the loop-body top; codegen drops the redundant `SInvariant` marker).
      # A holding invariant doesn't interfere; a violated one panics (observed
      # via a try/catch expression). MSIL target only.
      - name: Loop-invariant self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/loop_invariant_self_test.l

      # Function-value invocation — pins #1877: invoking a function-typed value
      # (`f()` where f: () -> R) through the uniform Func ABI.  Zero-argument
      # value/string/void HOFs must run and print the correct results, and a
      # parameter-USING lambda must fail loud (#1939, until arg unboxing lands).
      - name: Function-value invocation (#1877)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/function-value-invocation-self-test.sh
      # Capturing closures (#1479 v1+v2) — a lambda that captures an immutable
      # enclosing binding is captured by value into an object[] bound as the
      # delegate target (v1); a captured `var` is hoisted to a shared heap cell
      # so reassignments are observable across the closure boundary in both
      # directions (v2).  Both must run and produce correct results.
      - name: Capturing closures (#1479 v1+v2)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/capturing-closures-self-test.sh
  # Second half of compiler self-tests (.NET target), running in parallel with job -a.

      - name: Wait for all parallel tests
        wait-all: true

      # await nested inside ETuple/EList/EIndex/EInterpolated/ERange self-test
      # (#4276): regression coverage for the seven match arms added to
      # collectAwaitTypesExprPB / exprContainsAwaitMsil. Imports only Std.*.
      # Run sequentially (not `background: true`) rather than folded into the
      # big parallel group above: adding it there as a 38th/39th concurrent
      # step reproducibly broke two unrelated, already-passing steps in that
      # group (`import extern self-test`, `Cross-package generics self-test`)
      # across two separate CI runs, with clean TAP output on both but a
      # `wait-all`-reported failure — a concurrency ceiling in the group, not
      # a defect in this test or the other two. See PR #4810.
      - name: MSIL await-expr-forms self-test (#4276, native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/msil/msil_await_expr_forms_self_test.l

  # Native (LLVM) backend self-tests — N7.1 (docs/10 D-progress-540/545).
  # Split out into its own job (previously a `background: true` step inside
  # compiler-self-tests-dotnet-a) because the work here is CPU-bound rather
  # than wait-bound: the twelve llvm_*_self_test.l files below contain ~135
  # individual `test { }` cases, and each one spawns its own `clang`
  # subprocess (compile a `.ll` module, link against lyric_rt.a, run the
  # binary) — 34 of them linking under `-fsanitize=address`, which is slow
  # to compile. Running that inside compiler-self-tests-dotnet-a meant these
  # ~124 sequential clang invocations competed for the runner's CPU with
  # ~20-40 other concurrent `background: true` steps in that job. A
  # dedicated runner gives clang/ASan the whole machine instead of queuing
  # behind unrelated self-tests, and keeps a slow native-backend run from
  # extending compiler-self-tests-dotnet-a's own `wait-all` barriers.
  native-backend-self-tests:
    runs-on: ${{ vars.CI_NATIVE_RUNNER || vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: [build]
    permissions:
      contents: read
    if: needs.build.outputs.has_code_changes == 'true' && needs.build.outputs.has_native_changes == 'true'
    steps:
      # This job's clang/gcc/ASan requirement (see the CI_NATIVE_RUNNER doc
      # comment above) is provisioned here rather than baked into a self-hosted
      # runner's image, so a fresh/bare self-hosted machine works without any
      # image customization -- mirrors the existing inline `sudo apt-get
      # install -y z3` pattern used elsewhere in this file. Skipped on
      # GitHub-hosted runners, which already ship clang/gcc/ASan, to avoid
      # spending time on a no-op install every run.
      - name: Install clang/gcc/ASan (self-hosted runners only)
        if: runner.environment == 'self-hosted'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang gcc build-essential lld

      # Point TMPDIR at `runner.temp` before the concurrent `background: true`
      # self-test steps below start. Despite this step's old name, this is NOT
      # about a "RAM disk" -- on a standard `ubuntu-latest` runner, `/tmp` and
      # `runner.temp` both sit on the same persistent disk, not tmpfs (the
      # actual tmpfs mounts there are `/dev/shm`, `/run`, `/run/lock`,
      # `/sys/fs/cgroup`). The occasional SIGBUS (exit 135) under load that
      # motivates this redirect (#4975) comes from disk I/O and memory
      # contention among the dozens of concurrent `dotnet`-hosted self-hosted-
      # compiler invocations in this job, not RAM-disk exhaustion.
      - name: Redirect temporary directory (disk-I/O / memory-contention mitigation, #4975)
        run: echo "TMPDIR=${{ runner.temp }}" >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Set up .NET (uses bootstrap/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: bootstrap/global.json
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts
      - name: Restore executable permissions
        # Wraps the downloaded stub in a dotnet-invoking shim; see the
        # runner-pools comment near the top of this file for why.
        run: |
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${{ env.BUILD_CONFIG }}/net10.0/lyric"
          cat > "$lyric_bin" <<'WRAPPER'
          #!/usr/bin/env bash
          exec dotnet "$(dirname "$0")/lyric.dll" "$@"
          WRAPPER
          chmod +x "$lyric_bin"

      # Builds lyric-rt (C unit tests under both clang and gcc), then runs the
      # three llvm self-tests: llvm_ir (serializer), llvm_codegen (N1 scalar
      # programs compiled through parse -> codegen -> clang -> run), and
      # llvm_heap (N2 records/unions/enums/distinct/match; its ARC cases build
      # with -fsanitize=address so a missed/premature/double release fails),
      # and llvm_self_test_n3 (N3.2 interface vtable dispatch; its ARC cases
      # likewise build under ASan to prove the interface box releases its
      # implementing object), and llvm_self_test_n34 (N3.4 protected types;
      # its ASan case proves the mutex buffer and a ref-typed field are both
      # torn down cleanly), llvm_self_test_async (D-N-022 real async:
      # async func lowers to an LLVM coroutine on the lyric-rt cooperative
      # scheduler; the sleep-driven cases prove spawned tasks genuinely
      # interleave, with the ARC/frame protocol ASan-checked),
      # and llvm_self_test_defer (P2.D1 `defer`: no try/finally on native,
      # so each lexical scope's pending deferred blocks run explicitly at
      # every scope exit -- fall-off, return, break, continue -- mirroring
      # the existing ARC scope-exit stack; a panic still bypasses it
      # entirely per D-N-003).
      #
      # llvm_tls_self_test (N9.2, issue #6103: Std.Encoding/Std.Tls/
      # Std.TcpHost native twins over the N9.1 lyric_sock_*/lyric_tls_*
      # seam -- a real loopback TLS handshake driven from compiled native
      # Lyric, server via hostAcceptTls, client on a genuine second
      # pthread since a TLS handshake needs both peers actively driving
      # handshake I/O, unlike a bare TCP connect; its ASan case covers the
      # LyricString/LyricList bridging this item added to lyric_tls.c
      # alongside; its item B now goes through Std.Tls's real
      # Certificate.fromPem/Identity.fromPem API, unblocked by the
      # llvm_opaque fix below).
      #
      # llvm_http_client_self_test (N9.4, issue #6105: Std.HttpHost native
      # client twin over the tcp_host.l client-TLS extension this item
      # added -- hostConnectTls/hostUpgradeClientTls, TlsClientTrust, and
      # an additive-CA lyric_tls_client_new_additive C seam alongside the
      # existing exclusive/system-default/insecure trust modes). Drives a
      # hand-rolled HTTP/1.1 client wire protocol (RFC 9112 request/status
      # line, header parsing, Content-Length and chunked transfer-encoding
      # framing, and a 301/302/303/307/308 redirect loop) since no sans-IO
      # client engine exists (Std.HttpEngine is server-only) and
      # Std.Http.HttpClient's own async-interface surface does not lower
      # on native yet (N3.2 covers non-async abstract methods only -- a
      # pre-existing, tracked gap this item's kernel deliberately routes
      # around by calling Std.HttpHost directly, per its module header).
      # The ASan case drives a genuine TLS handshake against a self-signed
      # certificate pinned via exclusive-CA trust, follows a redirect to a
      # fresh TLS connection, and dechunks a two-chunk response body -- all
      # over a real loopback socket with the server on a second pthread.
      #
      # llvm_http_server_self_test (N9.3, issue #6104: Std.HttpServer native
      # twin -- thread-per-connection over pthread_create driving the
      # sans-IO Std.HttpEngine FSM over Std.TcpHost, following the dotnet
      # twin's architecture rather than the JVM twin's JDK-HttpServer
      # bypass). The pull-model hand-off queue is built directly from
      # lyric_mutex_*/lyric_sem_* (D-progress-809) since there is no BCL
      # ConcurrentQueue/SemaphoreSlim equivalent; every raw buffer handle is
      # stored as Long, mirroring tcp_host.l's Conn.tlsConnHandle idiom.
      # stopListener deterministically pthread_joins the accept thread and
      # every spawned connection thread before freeing the queue -- a
      # stronger, blocking-until-drained shutdown than the dotnet/JVM
      # twins' fire-and-forget one, since native has no GC to defer the
      # malloc'd-buffer cleanup to. v1 is HTTP/1.1 only (a negotiated-h2
      # connection is closed rather than mis-parsed -- N9.5/#6106 tracks
      # native h2) with no LYRIC_HTTP_MAX_CONNECTIONS cap yet (Std.Parse has
      # no native kernel). Seven cases: item A is a plaintext round trip on
      # a single thread (a bare TCP connect completes into the backlog
      # before accept runs); item B is a real concurrent TLS round trip
      # with the client on a second pthread driving N9.4's real
      # hostConnectTls API; item C drives the h2-rejection guard end to end
      # by having the client genuinely negotiate h2 ALPN and asserting the
      # server closed the connection; item D is a keep-alive round trip
      # (two requests over one connection, neither carrying Connection:
      # close); item E is the #6791 regression -- stopListener must not
      # hang on a genuinely idle keep-alive connection (Std.HttpEngine
      # defaults keepAlive = true, so this is the default HTTP/1.1
      # behavior, not an edge case) -- fixed by tracking every accepted
      # Conn in ServerQueue.activeConns and hostShutdown-ing each one
      # before stopListener joins its handler thread; item F is the #6792
      # regression -- spawnHandler used to register a connection into
      # activeConns AFTER spawning its handler thread, racing that
      # thread's own unregisterConn for a connection that finishes fast
      # enough (a connect-then-immediate-disconnect scan), which could
      # leave a permanently stale, already-closed entry behind -- fixed by
      # registering BEFORE spawning, so the child thread's own start is
      # always ordered after its registration; item G is the #6795
      # regression -- stopListener snapshotted activeConns under the queue
      # mutex, released it, then called hostShutdown on each entry with no
      # further synchronization, so a connection finishing NATURALLY and
      # concurrently (an ordinary Connection: close exchange completing
      # while stopListener runs -- the common graceful-shutdown case, not
      # an edge case) could be unregisterConn'd and hostClose'd by its own
      # thread between the snapshot and its hostShutdown call, shutting
      # down an already-closed/reused fd -- fixed by holding the mutex
      # across the entire snapshot-then-shutdown sequence, making the race
      # impossible by construction; item G spawns twenty concurrent clients
      # each sending a real Connection: close request to prove stopListener
      # still completes cleanly and promptly under that concurrent load.
      #
      # llvm_opaque (#6234 part 1: `opaque type` codegen -- construction,
      # field access, mutation, UFCS methods, and an opaque type nested in
      # a record all lower identically to a record on both the single-file
      # and bundled-stdlib collection paths; a `@projectable opaque type`
      # is refused with a clear N0101 diagnostic rather than silently
      # compiling with lost semantics; its ASan case constructs 2000
      # `Certificate`-shaped opaque instances -- mirroring `Std.Tls`'s real
      # `Certificate`/`Identity` -- in a loop to prove the synthesised
      # destructor releases the ARC-managed field with no leak/double-free).
      #
      # llvm_enum_case_resolve (#6589: a bare enum-case VALUE reference --
      # no qualifying `EnumType.` prefix at all -- failed to resolve,
      # whether the reference sat in the same file as the enum or a
      # different package; `ctx.enumDefs` only ever indexed a case under
      # its qualified forms, never the bare case name alone, mirroring
      # the fix now applied: `Msil.Codegen.registerEnumDeclMsil`'s `cn`
      # key). Six cases (A-F): A covers #6589's own cross-package repro
      # (`Std.HttpEngine`'s `HttpVersion`/`Http1_1`, via the bundled
      # `Lyric.LlvmBridge` path); B/C cover the same-file bare-return-
      # value and bare-record-field-default cases
      # `docs/03-decision-log.md` D-progress-823 item D worked around
      # instead of fixing; D/E were added during this PR's own review
      # rounds -- D covers a bare case name shared by an enum and a
      # union in VALUE position (the `EPath` bare-name lookup must check
      # `ctx.enumDefs` before `ctx.caseRefs`, matching `Msil.Codegen`'s
      # order), and E covers the identical enum/union collision in
      # PATTERN position (issue #6753: `emitConstructorTest`'s enum
      # branch must gate on `sv.ty == NI32` so a union scrutinee is never
      # misrouted into it just because an unrelated enum shares the
      # union case's bare name); F covers an enum-vs-**enum** bare-name
      # collision (the bug class `lyric-stdlib/std/http_engine.l`'s own
      # header documents as issue #5995), asserting the deterministic
      # first-wins outcome `Msil.Codegen` already documents.
      #
      # llvm_inout (N9.6, #6794, unblocks #6808: `out`/`inout` function
      # parameters were not lowered at all for `--target native` --
      # `Lyric.LlvmCodegen` panicked unconditionally. The fix synthesizes
      # an implicit pointer parameter for each `out`/`inout` parameter (the
      # ADDRESS of the caller's storage cell) with no callee-side alloca --
      # every local read/write already treats `ctx.varSlots[name]` as a
      # bare pointer, so aliasing the parameter name directly to the
      # incoming pointer gives true by-ref semantics matching MSIL's
      # `MByRef`/JVM's boxed-cell lowering, including free chained
      # forwarding (an `inout` parameter passed on to another `inout` call,
      # the shape `Std.HttpEngine`'s H2 frame dispatch uses pervasively).
      # Nine cases: a scalar `inout Int` mutated across repeated calls, an
      # `out Int` parameter, two independent `inout` params in one call,
      # chained `inout` forwarding through a nested call, the exact
      # `record St { var n: Int }` / `bump(s: inout St)` repro from #6808's
      # own writeup, an `inout` argument that is a nested record field
      # access, two ARC cases under ASan (a `String` field reassignment
      # churn, and a record with a ref-typed field both mutated in place
      # and wholesale-replaced mid-loop -- proving retain-new/release-old
      # runs correctly through the by-ref alias), and a loud diagnostic
      # (not a silent miscompile) for the documented scope cut -- an
      # index-expression by-ref argument. Real-world validation:
      # `Std.HttpEngine.H2Frame`'s entire `inout FrameDecoder` mutually-
      # recursive dispatch chain (5 `inout` sites) now compiles and runs
      # for `--target native`; the sibling `Hpack`/`H2Conn` files still hit
      # a separate, pre-existing gap (`Std.Char` has no `_kernel_native`
      # twin, so its Huffman codec's char<->int bridge is unresolvable on
      # native) -- unrelated to this fix and tracked separately.
      #
      # The tests import `Lyric.Llvm*` compiler packages by source, so
      # LYRIC_LOAD_COMPILER=1.
      - name: Native backend self-tests (lyric-rt + llvm via native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/native-backend-self-tests.sh

      # `lyric test --target native` smoke test (N7.2): an ordinary
      # `@test_module` (no compiler-package imports, unlike the llvm_self_test_n*
      # files above) compiles through `Emitter.emitNative` and runs as a
      # self-contained binary — not via LYRIC_LOAD_COMPILER's in-process MSIL
      # host.  Native has no try/catch (D-N-003), so `TestSynth.synthesizeNative`
      # calls each test straight through: a passing suite prints normal TAP
      # output and exits 0; a failing assertion `panic`s the whole process
      # (nonzero/abort exit, no per-test isolation) — asserted here too, so a
      # future change that silently swallows the failure (exit 0) is caught.
      - name: Native lyric test --target native smoke test (N7.2)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/native-target-smoke-test.sh

      # `lyric build --target native --define` end-to-end (docs/60 #5977): with
      # both native-codegen gaps closed (list literals + module-level `val`
      # inlining), the CLI gate is lifted, so a `--define` feeds a `@build_const`
      # val on native. Asserts the in-source fallback (no --define) and the
      # substituted value (--define) in the actual native binary.
      - name: Native --define build (docs/60 #5977)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/native-define-build.sh

      - name: Wait for native backend self-tests
        wait-all: true

  compiler-self-tests-dotnet-b:
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    needs: [build]
    permissions:
      contents: read
    if: needs.build.outputs.has_code_changes == 'true' && needs.build.outputs.has_core_changes == 'true'
    steps:
      # Point TMPDIR at `runner.temp` before the concurrent `background: true`
      # self-test steps below start. Despite this step's old name, this is NOT
      # about a "RAM disk" -- on a standard `ubuntu-latest` runner, `/tmp` and
      # `runner.temp` both sit on the same persistent disk, not tmpfs (the
      # actual tmpfs mounts there are `/dev/shm`, `/run`, `/run/lock`,
      # `/sys/fs/cgroup`). The occasional SIGBUS (exit 135) under load that
      # motivates this redirect (#4975) comes from disk I/O and memory
      # contention among the dozens of concurrent `dotnet`-hosted self-hosted-
      # compiler invocations in this job, not RAM-disk exhaustion.
      - name: Redirect temporary directory (disk-I/O / memory-contention mitigation, #4975)
        run: echo "TMPDIR=${{ runner.temp }}" >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Set up .NET (uses bootstrap/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: bootstrap/global.json
      - name: Set up Java 21 (for JVM emitter tests — class files target major version 65)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts
      - name: Restore executable permissions
        # Wraps the downloaded stub in a dotnet-invoking shim; see the
        # runner-pools comment near the top of this file for why.
        run: |
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${{ env.BUILD_CONFIG }}/net10.0/lyric"
          cat > "$lyric_bin" <<'WRAPPER'
          #!/usr/bin/env bash
          exec dotnet "$(dirname "$0")/lyric.dll" "$@"
          WRAPPER
          chmod +x "$lyric_bin"

      # source_path_diagnostics_self_test.l and jvm_sourcefile_attr_self_test.l
      # (below) spawn `./bin/lyric` as a subprocess, resolved relative to CWD
      # (repo root) -- the same `./bin/lyric` symlink `make lyric` creates for
      # local dev (Makefile's `lyric` target: `ln -sf "../$(AOT_BIN)" bin/lyric`).
      # This job downloads only the AOT binary's own nested path
      # (bootstrap/src/Lyric.Cli.Aot/bin/...), never runs `make lyric`, and has
      # no other step creating bin/lyric, so recreate the same symlink here.
      - name: Create ./bin/lyric symlink for subprocess-spawning self-tests
        run: |
          mkdir -p bin
          ln -sf "../bootstrap/src/Lyric.Cli.Aot/bin/${{ env.BUILD_CONFIG }}/net10.0/lyric" bin/lyric

      # MSIL backend self-tests M2a-M2d (native lyric test, D-progress-474 / #66)
      # — replaces the deleted F# MsilSelfTestM2{a,b,c,d}.fs Expecto wrappers.
      # M2a pins the #3085 fix (short-name collision `Msil.Kernel.ByteWriter`
      # vs `Std.Stream.ByteWriter` resolved by codegen scope tiers).  M2b-M2d
      # import packages exporting module-level `pub val` constants, so
      # `compilerClosureDllPaths` links the self-hosted-emitted compiler DLLs
      # staged under `<libdir>/selfhosted` by stage-selfhosted-compiler.sh —
      # the F#-emitted stage-1 metadata omits `pub val` decls (#3086).
      # lowering_token_self_test.l (#2473) covers the listTokensForLowering /
      # dictTokensForLowering cache hit/miss logic in Msil.Lowering; it rides
      # the same step because it imports `Msil.*` like M2a-M2d.
      # metadata_reader_self_test.l (#4751, #4786) verifies refPackDir() and
      # refPackDirDebugInfo() agree via Msil.MetadataReader; converted from a
      # plain `func main` program requiring LYRIC_LOAD_COMPILER=1 to
      # @test_module, so it now rides this step for the same reason.
      #
      # INVARIANT: this step stages compiler DLLs into `<libdir>/selfhosted`
      # while running as a `background: true` step alongside 22+ other
      # concurrent steps in this job. That's only safe because no other
      # concurrent step in compiler-self-tests-dotnet-b reads from that path.
      # If you add a new `LYRIC_LOAD_COMPILER=1` (or otherwise
      # selfhosted-compiler-dependent) background step to this job, it MUST
      # either run after this step completes or stage its own copy --
      # reading `<libdir>/selfhosted` concurrently with this step's staging
      # write is a race with no failure signal (silently flaky, not a
      # deterministic error).
      - name: MSIL backend self-tests M2a-M2d (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap/stage1 ] || [ ! -f .bootstrap/stage1/Lyric.Lyric.Cli.dll ]; then
            echo "::error::stage 1 bundle missing; skipping MSIL backend self-tests"
            exit 1
          fi
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${BUILD_CONFIG}/net10.0/lyric"
          if [ ! -x "$lyric_bin" ]; then
            echo "::error::AOT binary not found at $lyric_bin; skipping MSIL backend self-tests"
            exit 1
          fi
          bash scripts/stage-selfhosted-compiler.sh "$lyric_bin" "$(dirname "$lyric_bin")" .bootstrap/stage1
          ran=""
          for t in \
            lyric-compiler/msil/msil_self_test_m2a.l \
            lyric-compiler/msil/msil_self_test_m2b.l \
            lyric-compiler/msil/msil_self_test_m2c.l \
            lyric-compiler/msil/msil_self_test_m2d.l \
            lyric-compiler/msil/msil_self_test_m88.l \
            lyric-compiler/msil/msil_bracket_arg_self_test.l \
            lyric-compiler/msil/lowering_token_self_test.l \
            lyric-compiler/msil/metadata_reader_self_test.l ; do
            echo "=== $t ==="
            bash scripts/ci-retry-on-signal.sh "$lyric_bin" test --target dotnet "$t"
            ran="$ran $t"
          done
          echo "MSIL backend self-tests ran:$ran" >> "$GITHUB_STEP_SUMMARY"

      # Out/inout-parameter self-test — pins the self-hosted MSIL byref calling
      # convention (#1761): `out`/`inout` parameters are passed by managed
      # pointer so a callee's write reaches the caller.  MSIL target only; JVM
      # parity (holder-array lowering) is tracked in #1763.
      - name: Out/inout-parameter self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: "bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --summary \"out/inout-parameter self-test ran: outparam_self_test.l (--target dotnet)\" --target dotnet lyric-compiler/lyric/outparam_self_test.l"

      # Named-arg/default-param self-test — pins call-site named-arg reorder and
      # default-param fill (#1503).  JVM analog step is below.
      - name: Named-arg/default-param self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: "bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --summary \"named-arg/default-param self-test ran: func_default_args_self_test.l (--target dotnet)\" --target dotnet lyric-compiler/lyric/func_default_args_self_test.l"

      # Nested-generic self-test — pins #1687 on the MSIL target.  JVM-target
      # parity is gated on the union case-factory gap, tracked in #1707 (so this
      # step is `--target dotnet` only, unlike the bitwise self-test above).
      - name: Nested-generic self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/nested_generic_self_test.l

      # Union-ctor return-context self-test — pins #3813 follow-up: a bare
      # `Some(...)` built in a function returning `Result[Rec, E]` must infer
      # its type-arg from the argument, not borrow the return type's args.
      # MSIL target only (the construction-context fix lives in the MSIL
      # codegen); the inference half is target-agnostic.
      - name: Union-ctor return-context self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/union_ctor_return_context_self_test.l

      # Self-method-call self-test — pins #1715: intra-impl method calls
      # (`self.m()` and bare `m()`) were dropped by the self-hosted MSIL
      # backend, returning null/the argument instead of the call result.
      # MSIL target only; JVM-target parity is tracked in #1722.
      - name: Self-method-call self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/self_method_call_self_test.l

      - name: Wait for parallel tests (dotnet-b batch 1 split, #4975)
        wait-all: true
      # #6348: MSIL now routes `.indexOf`/`.lastIndexOf` to the Std.String
      # Option-returning free functions when the file imports Std.String
      # (matching the checker and the JVM's #6124 semantics) — before that
      # fix this suite crashed the .NET runtime with an
      # AccessViolationException (raw int32 flowing into an Option match's
      # isinst).  The dotnet leg pins it.
      - name: JVM-trio positive-path self-test on dotnet (native lyric test --target dotnet)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/jvm_trio_positive_self_test.l
      # Aliased-import routing pin (#6496 resolution): `import Std.String as
      # Str` routes the method spelling to the Option free functions exactly
      # like the unaliased form, on dotnet here (the JVM leg runs in
      # compiler-self-tests-jvm), and pins indexOfRaw/lastIndexOfRaw's raw
      # -1-sentinel semantics.
      - name: Aliased-import indexOf routing self-test on dotnet (native lyric test --target dotnet)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/indexof_aliased_bcl_self_test.l
      # Funcval-invoke materialization pin (#6511): a function-typed param's
      # invoke result is downcast to its declared reference-class return, and
      # a directly-passed lambda inherits the param's declared return type for
      # union-case construction inference.  The impl-method indirection is the
      # exact NativeQueue::consume shape that produced invalid IL.
      - name: Funcval return materialization self-test on dotnet (native lyric test --target dotnet)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/funcval_ret_materialize_self_test.l
      # The same shapes are target-portable and meaningful MSIL coverage
      # (#6494 review) — run them on dotnet too.
      - name: Expression-branch stackmap self-test on dotnet (native lyric test --target dotnet)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/jvm/stackmap_expr_branch_jvm_self_test.l

      # Extra barrier (dotnet-b batch 1a-split, #5933 pattern): the sibling
      # dotnet-a job's exit-135 random-step kills (SIGBUS-class, memory
      # pressure from concurrent in-process compilations) reached this job on
      # 2026-07-17 — the Propagate self-test died mid-batch on PR #5953's run
      # (a comment-only diff). This first group ran 12 concurrent in-process
      # compilations; split 6 + 6 (counts per #5959/#5965 — beware that the
      # MSIL step's INVARIANT comment contains the literal text
      # "background: true", which fools naive greps into counting 13).
      - name: Wait for parallel tests (dotnet-b batch 1a-split)
        wait-all: true

      # Implicit-self record-method self-test on the MSIL target (mirrors
      # implicit_self_jvm_self_test.l, already wired below for --target jvm).
      # Pins #4947: a D037 in-body method (a bare `func` inside a record
      # body) was silently dropped from MSIL emission while the entry-point
      # pre-scan still reserved a MethodDef row for it, desyncing every
      # MethodDef token computed afterwards — including the `@test_module`'s
      # synthesised `main` — and corrupting the assembly's EntryPointToken
      # (`dotnet exec` then threw `MissingMethodException: Entry point not
      # found`).  This is the first --target dotnet self-test to exercise an
      # in-body method, so it is the regression guard for that class of bug.
      - name: Implicit-self record-method self-test (native lyric test, #4947)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/implicit_self_msil_self_test.l

      # Named-arg-order self-test — pins D-progress-357: record construction with
      # named arguments out of declaration order stored values into the wrong
      # field slots (invalid IL / cross-typed fields).  MSIL target only.
      - name: Named-arg-order self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/named_arg_order_self_test.l

      # Record-option-field self-test — pins #1731 / D-progress-359: a `None`
      # (or `Some`) value for a concrete `Option[T]` record field must carry the
      # field's type argument so a later `match` on the field finds the arm.
      # MSIL target only; JVM-target parity is tracked in #1740.
      - name: Record-option-field self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/record_option_field_self_test.l

      - name: Wait for parallel tests (dotnet-b batch 2 split, #4975)
        wait-all: true

      # Generic-specialization self-test — pins #1730 / D-progress-360: a *called*
      # same-package generic NRE'd in lowerFuncMsil, and the monomorphizer's
      # AST-rewrite reconstructed `Option` fields (the `if`-else branch, guards,
      # returns, finally) via a two-arm `None`/`Some` match that the bootstrap F#
      # emitter widened to `Option<object>`, corrupting every rewritten function.
      # MSIL target only; JVM-target parity for same-package generic
      # specialization is tracked in #1707.
      - name: Generic-specialization self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/generic_specialization_self_test.l

      # Stdlib-generic monomorphization self-test — pins #1727 (inference slice):
      # the monomorphizer is fed the stdlib's pure-Lyric generic `pub func`s,
      # rewrites impl/interface method bodies, and infers types through
      # `self.field` and Map/List indexing, so calls like `unwrapOr(b.opts[i], d)`
      # specialise into a concrete copy.  MSIL target only; JVM parity tracked
      # in #1707.
      - name: Stdlib-generic-mono self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/stdlib_generic_mono_self_test.l

      # Map-option self-test — pins #1727 (codegen slice): `mapGet(m, key)` lowers
      # to a real `Option[V]` (`ContainsKey ? Some(get_Item) : None`) with `V` from
      # the call's context hint, and `Map.remove(key)` calls the real
      # `Dictionary.Remove` (was a pop-only stub).  Together these closed the
      # lyric-session store suite (24/31 -> 31/31).  Also pins #5003 (JVM):
      # nesting a branching call (`mapGet`) directly as a constructor argument
      # (`Ok(mapGet(...))`) used to `VerifyError` ("Inconsistent stackmap
      # frames") — `lowerConstruction` now evaluates every argument into a
      # local before `new; dup`.  JVM half runs in `compiler-self-tests-jvm`
      # (needs JDK 21, unlike this dotnet-only job).
      - name: Map-option self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/map_option_self_test.l

      # Concurrency cap: this parallel group was 23 background steps, past the
      # ~18 safe peak; halve it to ~12 concurrent in-process compilations with
      # this barrier to stop the intermittent concurrent-output/status flakes.
      - name: Wait for parallel tests (batch 1a)
        wait-all: true

      # Propagate self-test — the `?` error-propagation operator (#1475).
      # `EPropagate` was a codegen no-op (`x?` compiled as `x`); the
      # `Lyric.Propagate` middle-end pass now lowers it to match-unwrap +
      # early-return.  Run via native `lyric test`: compiled in-process
      # through the self-hosted `Msil.Bridge`, so the lowering under test is
      # the one that runs.  MSIL target only (epic #1470 defers JVM).
      - name: Propagate self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/propagate_self_test.l

      # List-value-compare self-test — #1779 bug A.  A comparison / arithmetic
      # on a `List[ValueType]` element-access result (`xs[i] <= 0`) miscompiled
      # because the boxed `List<object>` slot wasn't unboxed back to the value
      # type.  Run via native `lyric test` (in-process through Msil.Bridge).
      - name: List-value-compare self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/list_value_compare_self_test.l

      # Equality self-test — #1480 (partial).  `==`/`!=` on a record / distinct
      # type with `@derive(Equals)` now dispatches to the synthesised structural
      # `equals` (it reaches codegen only after #1796); records are no longer
      # compared by reference.  Run via native `lyric test` (in-process through
      # Msil.Bridge).
      - name: Equality self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/equality_self_test.l

      # Map-key self-test — #1480 (MSIL) / #4982 Finding 1 (JVM).  Records with
      # `@derive(Equals)` + `@derive(Hash)` now carry synthesised
      # `Object.Equals`/`GetHashCode` overrides on MSIL and `equals(Object)`/
      # `hashCode()` overrides on JVM, so field-equal instances are the same
      # BCL `Map`/`java.util.HashMap` key on both targets.  Run via native
      # `lyric test` (in-process through Msil.Bridge / Jvm.Bridge).
      - name: Map-key self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/map_key_self_test.l

      # Map-value self-test — #1835.  `Map[K, ValueType]` values read correctly
      # in hint-less positions (`match mapGet(m, k)`, `m[k]`) — the value type
      # is tracked + unboxed instead of erasing to `Option<object>`.  Run via
      # native `lyric test` (in-process through Msil.Bridge).
      - name: Map-value self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/map_value_self_test.l

      # Extra barrier (batch 2-split, #5933 pattern): the group that actually
      # contained the Propagate self-test kill (see the barrier above) ran 11
      # concurrent; split 5 + 6.
      - name: Wait for parallel tests (dotnet-b batch 2-split)
        wait-all: true

      # Impl-method self-test — #1784.  Interface/impl methods with value-type
      # parameters (`Int`/`Bool`/`Double`/`Char`) — and `?`/early-`return` in
      # their bodies — dispatch correctly (value-type args are no longer boxed
      # against the value-type param signature).  Run via native `lyric test`.
      - name: Impl-method self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/impl_method_self_test.l

      # Alias-rewriter self-test — #1834.  The package-alias rewriter
      # (`Lyric.AliasRewriter`) now descends into the compound item kinds
      # (IImpl / IInterface / IUnion and friends), so an `import X as Y`
      # reference inside an `impl` method body, an interface method signature,
      # or a union case payload resolves instead of tripping T0020.  Run via
      # native `lyric test` (in-process through Msil.Bridge).  Imports only
      # `Std.*`, so no `LYRIC_LOAD_COMPILER=1`.
      - name: Alias-rewriter self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/alias_rewriter_self_test.l

      # Propagate-hoist entry-polarity pin — D-progress-769.  AST-level pin
      # (model: alias_rewriter_self_test.l) for Lyric.HoistEngine's
      # asyncGated=false axis as applied to protected-type entries: parses a
      # small source with an entry-bodied `?` in stacked operand position,
      # runs it through Lyric.Propagate.lowerPropagateFile, and asserts the
      # entry body gained the hoisted val.  dotnet-only — see the file's
      # module doc for why a runtime test (and a JVM twin) aren't possible.
      - name: Propagate-hoist entry-polarity self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/propagate_hoist_entry_polarity_self_test.l

      # Ensures self-test — #1871.  `ensures:` contract clauses now compile and
      # run through the self-hosted MSIL path: the contract elaborator's
      # synthesised `let __lyric_result_<n> = …` binding no longer NREs in
      # codegen (the bare `None` ty field that widened to `Option[obj]` is now
      # pinned).  Run via native `lyric test` (in-process through Msil.Bridge).
      # Imports only `Std.*`, so no `LYRIC_LOAD_COMPILER=1`.
      - name: Ensures self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/ensures_self_test.l

      - name: Wait for parallel tests (dotnet-b batch 4 split, #4975)
        wait-all: true

      # Mono-shadow self-test — #1855.  A user-defined function now shadows an
      # imported generic of the same bare name in the monomorphizer, so calling
      # a local `func tag(o: Option[Int]): Int` (which collides with the stdlib
      # proof generic `Std.Core.tag[T]`) via an annotated local no longer
      # mis-specialises into a broken identity stub (invalid IL).  Run via
      # native `lyric test` (in-process through Msil.Bridge, which seeds the
      # monomorphizer with the stdlib generics as imports).  Imports only `Std.*`.
      - name: Mono-shadow self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh --target dotnet lyric-compiler/lyric/mono_shadow_self_test.l

      # Mono-shadow self-test is dotnet-only (#2000).  Although the module
      # imports only Std.*, the JVM backend currently emits invalid stackmap
      # frames for its monomorphised generic call shapes (the class fails JVM
      # verification), so `--target jvm` cannot run it yet.  JVM monomorphisation
      # parity is tracked under the JVM-backend remediation in docs/41.

      # CLI did-you-mean suggestion self-test — exercises Lyric.CliSuggest
      # (editDistance / suggestCommand) via native `lyric test`.  The
      # Lyric.CliSuggest compiler-package import is resolved by linking the
      # stage-1 bundle DLLs (#2364); no `LYRIC_LOAD_COMPILER=1` recompile.
      # Pure logic (Std.Core/Collections only), so it runs cleanly through the
      # in-process bundle.  Part of the ecosystem-DX epic #1968 (#1976/#1988).
      - name: CLI-suggest self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/cli_suggest_self_test.l

      - name: CLI-upgrade self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/cli_upgrade_self_test.l

      # CLI project-aware-defaults end-to-end smoke test — exercises
      # findNearestManifest (Lyric.Discovery), the bare-`lyric` build default,
      # and the did-you-mean / --help UX through the real binary (#1968:
      # #1969/#1970/#1976/#1988).  This is the integration counterpart to the
      # cli-suggest unit self-test: findNearestManifest itself can't be a
      # `lyric test` self-test because that path can't yet run host-backed
      # stdlib (Std.File) at runtime (#2001), so we drive the behaviour
      # end-to-end via the compiled CLI instead.
      - name: Release self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/release_self_test.l

      # Drain all earlier background steps before the heavy project self-tests,
      # which run heavy in-process multi-package builds and need
      # exclusive access to memory rather than competing with 24+ concurrent
      # compilation processes.
      - name: Wait for parallel tests before heavy project self-tests
        wait-all: true

      # MSIL project bridge self-test — exercises the self-hosted multi-package
      # MSIL bridge (Msil.Bridge.compileProjectToMsil /
      # compileProjectToMsilWithFeatures) end-to-end.  Covers Phases 1–3:
      # independent bundles, cross-package function/record/union round-trips,
      # and cfg-erasure diagnostics (F0012/F0013).  Placed in lyric-compiler/
      # so the Msil.Bridge transitive closure does not overflow the F# bootstrap
      # emitter; stage-1 DLLs provide the compiler-package imports (#2888).
      - name: MSIL project bridge self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/msil_project_bridge_self_test.l

      # Enum case-name collision self-test (#5995, plus #6638/#6639/#6640
      # follow-ups and the #6650 real-stdlib-enum coverage) — compiles small
      # multi-package fixtures through BOTH `Msil.Bridge.compileProjectToMsil`
      # and `Jvm.Bridge.compileProjectToJarBundledWithFeatures` in-process
      # (its own "dotnet: …" and "jvm: …" test bodies run both bridges from
      # this single step; no separate `--target jvm` invocation needed), runs
      # each produced binary, and asserts stdout — the same heavy in-process
      # multi-package-build shape as `msil_project_bridge_self_test.l` above
      # and `jvm_cross_package_collision_self_test.l`, so it rides the same
      # non-background placement.  The #6650 case additionally links the REAL
      # compiled stdlib (`Emitter.findStdlibSources()`), needing the same
      # `dotnet`/Java 21 toolchain this job already sets up.
      - name: Enum case-name collision self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/enum_case_collision_self_test.l

      # MSIL codegen diagnostics self-test (#4898) — pins that the F0021-F0025, F0034
      # external-interface-conformance and try-catch-as-expression codegen
      # errors are reported as positioned CodegenCtx.diagnostics entries
      # (gated by Msil.Bridge via Lyric.DiagnosticUtil.diagReportAndAbort)
      # instead of an escaped panic().  Same in-process Msil.Bridge surface as
      # msil_project_bridge_self_test.l above.
      - name: MSIL codegen diagnostics self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/msil_codegen_diag_self_test.l

      # Emitter project self-test — exercises the Phase 4 in-process routing in
      # Lyric.Emitter.emitProject (multi-package DOTNET builds).  Covers aliased
      # imports, per-package isolation, @cfg erasure via emitProject, restored-dep
      # wiring, and subprocess-fallback routing (#2888).
      - name: Emitter project self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/emitter_project_self_test.l

      # MSIL restored-dependency bridge self-test (#6440) — the two-assembly
      # harness `msil_project_bridge_self_test.l` never had: compiles a
      # producer package to its own DLL, reloads it through
      # `Lyric.RestoredPackages` (the exact `[dependencies] path` restore
      # round-trip), and compiles+runs a consumer against it via
      # `Msil.Bridge.compileProjectToMsilWithRestored`.  Pins restored
      # record-body method dispatch (plain and chained `Self`-returning,
      # with a field-name collision present) end to end.
      - name: MSIL restored bridge self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/msil_restored_bridge_self_test.l

      # Value-type-generic instance-extern build-panic self-test (#5825).
      # Same in-process `Lyric.Emitter.emitProject` surface as
      # `emitter_project_self_test.l` above (not `msil_project_bridge_self_test.l`'s
      # `Msil.Bridge.compileProjectToMsil*` surface, which is a different bridge
      # entry point) — kept as its own file since it asserts a build-time PANIC
      # (assertPanicsWith) rather than a successful compile+run.
      - name: Generic extern value-type instance self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/generic_extern_valuetype_instance_self_test.l

      # Required-field-missing exit(78) self-test (#6200), split out of
      # config_block_self_test.l: pulls in `Lyric.Emitter` to compile+run TWO
      # nested subprocess fixtures (one per target) in-process — the same
      # heavy `Lyric.Emitter.emitProject` surface as `emitter_project_self_test.l`
      # and `generic_extern_valuetype_instance_self_test.l` above, so it needs
      # the same exclusive-resource placement (moved out of
      # compiler-self-tests-dotnet-a, #6319 follow-up: running it there
      # alongside ~40 other concurrent `background: true` steps starved the
      # nested MSIL+JVM compiles under memory pressure and produced a
      # corrupted/incomplete JVM fixture — exit 1 instead of the documented
      # 78 — even though the SAME code passes reliably in an unloaded
      # environment). The abort happens inside a static initializer that runs
      # before `main`, so it can't be observed in-process; the JVM type
      # checker also can't currently resolve a qualified
      # `Emitter.ProjectPackage` type reference, so this file (the OUTER test
      # module) compiles dotnet-only — its two test bodies still target the
      # NESTED fixture at both `Emitter.Dotnet` and `Emitter.Jvm`, covering
      # both targets' exit(78) behavior from this one run.
      - name: Config-block required-field-missing self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/config_block_missing_required_self_test.l

      # docs/63 §9.7 / #6284: single-file (dotnet + jvm) and manifest-project
      # diagnostics now carry the real source path; multi-file project-package
      # parse errors carry the package label (line number stays blob-relative
      # pending #6282). Spawns the just-built ./bin/lyric as a subprocess per
      # case (the only way to observe Lyric.Pipeline.gate's printed stderr),
      # so it needs the same exclusive, non-background placement as the
      # config-block step above.
      - name: Source-path diagnostics self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/source_path_diagnostics_self_test.l

      # docs/63 §9.7 / #6284: the JVM backend now emits a real JVMS §4.7.10
      # SourceFile attribute naming the real path, for both the plain
      # single-file build and the common single-package-project manifest
      # shape. Shells out to unzip/javap (already a hard CI dependency for
      # every JVM self-test that runs its JAR under `java`).
      - name: JVM SourceFile attribute self-test (native lyric test)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/jvm_sourcefile_attr_self_test.l

      - name: Init self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/init_self_test.l

      - name: Union-in-list match self-test (native lyric test, #2126)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/union_list_match_self_test.l

      # Module-level val self-test — exercises M5.2 stage 3 (non-constant `val`
      # at package scope emitted as a static readonly field initialized in .cctor).
      # Covers both the inline ldc.i4 path (literal Int/Bool) and the ldsfld path
      # (String, binary-op results).  Imports only Std.*; no LYRIC_LOAD_COMPILER.
      - name: Module-val self-test (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/module_val_self_test.l

      - name: Wait for parallel tests (dotnet-b batch 5 split, #4975)
        wait-all: true

      # @stubbable + StubCounter self-test (#1776).  Verifies the full
      # @stubbable → synthesised Stub record + impl path combined with the
      # Std.Testing.Mocking StubCounter call-count API (makeStubCounter /
      # stubCounterIncrement / stubCounterGet / stubCounterReset).  Compiled
      # in-process through the self-hosted Msil.Bridge.  Imports only Std.*;
      # no LYRIC_LOAD_COMPILER=1 needed.
      - name: Stubbable + StubCounter self-test (native lyric test, #1776)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/stubbable_self_test.l

      # Culture-invariant toString(DateTime) self-test (#2184).  Pins the
      # self-hosted MSIL emitter's `toString` builtin to InvariantCulture for
      # DateTime values so stage-0 (F#) and stage-1 (self-hosted) render
      # DateTime byte-identically regardless of the CI host locale.  Compiled
      # in-process through the self-hosted `Msil.Bridge`.  Imports only
      # `Std.*`, so no `LYRIC_LOAD_COMPILER=1`.
      - name: DateTime-toString self-test (native lyric test, #2184)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/datetime_tostring_self_test.l

      # Std.Console stdin/stdout/stderr round-trip on --target dotnet (#4816/
      # #4817) — the MSIL-target counterpart to the JVM job's
      # `console_roundtrip_jvm_main.l` check.  First executable proof that
      # `_kernel/console_host.l`'s `hostReadLineOpt` seam (added in #4816 to
      # replace the `case null` idiom the self-hosted MSIL/JVM backends
      # miscompile as an unconditional catch-all, #4775) actually observes
      # real stdin input rather than reporting EOF on every call.  A plain
      # program because TAP tests have no stdin.
      - name: Std.Console round-trip on dotnet (lyric build --target dotnet)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${BUILD_CONFIG}/net10.0/lyric"
          if [ ! -x "$lyric_bin" ]; then
            echo "::error::AOT binary not found at $lyric_bin; skipping console dotnet round-trip"
            exit 1
          fi
          work="$(mktemp -d)"
          "$lyric_bin" build lyric-compiler/msil/console_roundtrip_msil_main.l --target dotnet -o "$work/console.dll"
          cp bootstrap/src/Lyric.Cli.Aot/bin/${BUILD_CONFIG}/net10.0/Lyric.Stdlib*.dll "$work/"
          out="$(cd "$work" && printf 'alpha\nbeta\n' | dotnet exec console.dll 2>"$work/err.txt")"
          echo "$out"
          grep -qx "echo:alpha" <<< "$out" || { echo "::error::alpha echo missing"; exit 1; }
          grep -qx "echo:beta" <<< "$out" || { echo "::error::beta echo missing"; exit 1; }
          grep -qx "eof-after:2" <<< "$out" || { echo "::error::EOF line count wrong"; exit 1; }
          grep -qx "err-line" "$work/err.txt" || { echo "::error::stderr line missing"; exit 1; }

  # Release Native AOT end-to-end — `lyric build --release --aot` compiles a
  # hello-world Lyric program to a self-contained native binary via
  # `dotnet publish -p:PublishAot=true` and asserts it executes correctly
  # (#1975 / D079).  Isolated into its own job because it needs clang/lld
  # for the ILCompiler linker pass and downloads the Microsoft.DotNet.ILCompiler
  # NuGet package (~200 MB) on first run.

      - name: Wait for all parallel tests
        wait-all: true
  aot-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    if: needs.build.outputs.has_code_changes == 'true' && needs.build.outputs.has_core_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Set up .NET (uses bootstrap/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: bootstrap/global.json
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts
      - name: Restore executable permissions
        # Wraps the downloaded stub in a dotnet-invoking shim; see the
        # runner-pools comment near the top of this file for why.
        run: |
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${{ env.BUILD_CONFIG }}/net10.0/lyric"
          cat > "$lyric_bin" <<'WRAPPER'
          #!/usr/bin/env bash
          exec dotnet "$(dirname "$0")/lyric.dll" "$@"
          WRAPPER
          chmod +x "$lyric_bin"

      # ILCompiler package cache — keyed on the .NET SDK version so the
      # ~200 MB compiler package is not re-downloaded on every run.
      # restore-keys fallback on the runner.os prefix so a SDK patch-version bump
      # in global.json reuses the previous cache rather than downloading 200 MB.
      - name: Cache ILCompiler NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages/microsoft.dotnet.ilcompiler
          key: ${{ runner.os }}-ilcompiler-${{ hashFiles('bootstrap/global.json') }}
          restore-keys: |
            ${{ runner.os }}-ilcompiler-

      # clang and zlib1g-dev are required by the ILCompiler linker pass on Linux.
      - name: Install native-AOT linker prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y clang zlib1g-dev

      # Build a minimal hello-world Lyric program to a native binary, then run
      # it and assert the output.  This exercises the full pipeline:
      #   lyric build → F# emit → staging DLL → dotnet publish -p:PublishAot=true → native ELF
      - name: Release Native AOT smoke test (lyric build --release --aot, #1975)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/release-native-aot-smoke.sh
      # Regression test for #5782: `buildReleaseProject` (the manifest/
      # multi-package `lyric build --release --aot` path, as opposed to the
      # single-file smoke test above) silently dropped every `[nuget]`
      # dependency from the ILC reference list, so any Native AOT binary
      # touching a `[nuget]`-resolved type crashed at runtime with
      # `FileNotFoundException`. This builds a two-package manifest project
      # with a genuine third-party NuGet dependency (Newtonsoft.Json — not
      # part of the shared framework, so it must actually be restored and
      # passed to ILC as a reference) and asserts the produced binary can
      # call into it correctly.
      - name: Release Native AOT smoke test — manifest project with [nuget] dep (#5782)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/release-native-aot-manifest-nuget-smoke.sh
      # Regression test for #5787: the #5782 fix above only exercised a
      # third-party NuGet assembly (`nugetThirdPartyPaths`). It never covered
      # a restored LYRIC package reaching ILC via `resolved.restoredDlls` —
      # the path a `[nuget]`-declared Lyric package (e.g. Lyric.Web,
      # Lyric.Docker) and a local `path = "..."` / workspace dependency both
      # funnel through in `buildReleaseProject`. This builds a separate
      # dependency package to its own DLL first (never `--release`, since
      # only the consuming app's ILC pass is under test), then a second
      # manifest project that depends on it via `[dependencies]` `path = ...`
      # and builds THAT with `--release --aot`, asserting the produced
      # native binary can call into the restored dependency correctly.
      - name: Release Native AOT smoke test — manifest project with local path dependency (#5787)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/release-native-aot-manifest-localdep-smoke.sh
      # Native AOT publish of the `lyric` CLI itself (#1494 / Band 5).
      # `dotnet publish` honours the csproj's `<PublishAot>true</PublishAot>`,
      # producing a self-contained native ELF that AOT-compiles the whole
      # Lyric-emitted compiler (stage-1 DLL closure).  The step then runs a
      # REAL `lyric build` through the published native binary and executes
      # the result — proving the self-hosted pipeline works without the CLR
      # JIT.  It then exercises a RESTORED-DEPENDENCY build (the constdep/app
      # cross-package const-inlining scenario) through the same native binary:
      # reading the dependency DLL's embedded `Lyric.Contract` metadata now
      # goes through the metadata-direct reader (`Msil.MetadataReader`, pure
      # byte reading), not `Assembly.Load(byte[])`, so it works under Native
      # AOT where the IL loader is unavailable (#3201 / docs/45 / docs/42).
      - name: Native AOT publish of the lyric CLI (#1494)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/native-aot-publish-lyric-cli.sh
      # IConfig (config block) lowering self-test (#2983, #2992, #2993).
      # Wires `lyric-compiler/msil/msil_self_test_m85.l` via `lyric run` (the
      # AOT binary routes through the self-hosted MSIL emitter, which supports
      # `config {}` blocks; the F# bootstrap emitter does not, so `lyric run`
      # is the correct path).  Run 1 (env vars absent) verifies the default
      # path for the full v1 type set — Int/Bool/String/Long/Float/Double,
      # including a negated Float default and a Long default outside Int32
      # range — plus a second independent config block and field access
      # without panic.  Run 2 sets the EnvProbe env vars and verifies the
      # env-parse path (Int32.Parse / Int64.Parse / Boolean.Parse and the
      # culture-pinned Double.Parse).  A third compile-only probe asserts the
      # G0009 unsupported-field-type diagnostic.  No new F# runner needed.
      - name: IConfig config-block lowering self-test (lyric run, #2983)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/iconfig-lowering-self-test.sh
  macos-aot-smoke:
    runs-on: macos-latest
    needs: [build]
    permissions:
      contents: read
    if: needs.build.outputs.has_code_changes == 'true' && needs.build.outputs.has_core_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Set up .NET (uses bootstrap/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: bootstrap/global.json
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts

      # ILCompiler package cache — keyed on the .NET SDK version so the
      # ~200 MB compiler package is not re-downloaded on every run.
      - name: Cache ILCompiler NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages/microsoft.dotnet.ilcompiler
          key: ${{ runner.os }}-ilcompiler-${{ hashFiles('bootstrap/global.json') }}
          restore-keys: |
            ${{ runner.os }}-ilcompiler-

      # On macOS, the lyric binary inside the build-artifacts is a Linux binary (ELF)
      # so we must rebuild the AOT entry-point project (Lyric.Cli.Aot) on macOS.
      # Rebuilding is extremely fast because all dependencies (the lyric-compiled DLLs)
      # are already in .bootstrap/stage1/ from the downloaded build-artifacts.
      - name: Rebuild AOT entry-point on macOS
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          dotnet build bootstrap/src/Lyric.Cli.Aot --configuration $BUILD_CONFIG
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${BUILD_CONFIG}/net10.0/lyric"
          if [ ! -x "$lyric_bin" ]; then
            echo "::error::Rebuilt lyric binary not found or not executable at $lyric_bin"
            exit 1
          fi

      # Build a minimal hello-world Lyric program to a native binary, then run
      # it and assert the output.  This exercises the full custom lyric release pipeline
      # on macOS: lyric build --release --aot -> buildLinkerArgsMac -> resolveIlcPaths -> parseSdkPacksDir -> clang -> Mach-O
      - name: Release Native AOT smoke test (lyric build --release --aot, #4449)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap/stage1 ] || [ ! -f .bootstrap/stage1/Lyric.Lyric.Cli.dll ]; then
            echo "::error::stage 1 bundle missing; native AOT smoke test cannot run"
            exit 1
          fi
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${BUILD_CONFIG}/net10.0/lyric"
          dir="$(mktemp -d)"
          src="$dir/hello.l"
          cat > "$src" <<'LYRIC'
          package Hello
          import Std.Core
          func main(): Int {
            println("hello-aot")
            0
          }
          LYRIC
          native_bin="$dir/hello"
          "$lyric_bin" build --release --aot "$src" -o "$native_bin"
          if [ ! -x "$native_bin" ]; then
            echo "::error::native binary not produced at $native_bin"
            exit 1
          fi
          out="$("$native_bin" 2>&1)"
          echo "native AOT output: $out"
          if [ "$out" != "hello-aot" ]; then
            echo "::error::native AOT smoke test produced unexpected output: '$out'"
            exit 1
          fi
          echo "OK: native AOT binary produced and executed correctly on macOS." >> "$GITHUB_STEP_SUMMARY"

      # Native AOT publish of the lyric CLI itself on macOS.
      - name: Native AOT publish of the lyric CLI on macOS
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/native-aot-publish-lyric-cli-macos.sh
  compiler-self-tests-jvm:
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    needs: [build, build-stage2]
    permissions:
      contents: read
    # has_jvm_changes (not has_core_changes): this job is the JVM-specific
    # compiler self-test suite, and it also carries the only JVM-kernel
    # coverage for lyric-web/storage/resilience/auth (folded into
    # has_jvm_changes for exactly that reason — has_core_changes alone
    # would silently skip that coverage on a PR confined to just one of
    # those four libraries; see scripts/ci/detect-code-changes.sh).
    if: needs.build.outputs.has_code_changes == 'true' && needs.build.outputs.has_jvm_changes == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Set up .NET (uses bootstrap/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: bootstrap/global.json
      - name: Set up Java 21 (for JVM emitter tests)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts
      - name: Restore executable permissions
        # Wraps the downloaded stub in a dotnet-invoking shim; see the
        # runner-pools comment near the top of this file for why.
        run: |
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${{ env.BUILD_CONFIG }}/net10.0/lyric"
          cat > "$lyric_bin" <<'WRAPPER'
          #!/usr/bin/env bash
          exec dotnet "$(dirname "$0")/lyric.dll" "$@"
          WRAPPER
          chmod +x "$lyric_bin"
      # Stage-2 binary: needed only by the handful of steps below that
      # exercise a compiler-internal `@externTarget` signature-encoding fix
      # (System.Single `bufMsilType`, D125 follow-up) — such a fix only takes
      # effect once the compiler has recompiled itself with the fix already
      # applied, which stage-1 (built by the external stage-0 seed) cannot do.
      - name: Download stage-2 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: stage2-artifacts
          path: .bootstrap/stage2
      - name: Restore stage-2 executable permissions
        run: chmod +x .bootstrap/stage2/bin/lyric

      - name: Bitwise self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/bitwise_self_test.l

      # Coverage smoke test — NOT wired into CI yet (docs/03-decision-log.md
      # D135, #5294, #6659). `lyric test --target jvm --coverage` on this
      # exact file works standalone (verified locally, both in the sandbox
      # that built the feature and on the runner running this checkout via
      # `scripts/ci/coverage-smoke-test.sh` directly), but the JVM process
      # under the JaCoCo agent's `-javaagent` instrumentation hung for 2+
      # hours on real GitHub Actions runners across multiple attempts (with
      # curl/timeout hardening ruling out a network cause) — the plain,
      # non-instrumented `Bitwise self-test on JVM` step above runs fine in
      # this same job. Root cause not yet identified; see #6659 before
      # re-enabling.

      # Aliased-import routing pin, JVM leg (#6496 resolution): both import
      # forms route the method spelling to the Option free functions on both
      # targets, and indexOfRaw/lastIndexOfRaw keep the raw -1 sentinel.
      # The dotnet leg runs in compiler-self-tests-dotnet-b.
      - name: Aliased-import indexOf routing self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/indexof_aliased_bcl_self_test.l

      # Funcval-invoke materialization, JVM leg (#6511): the MSIL-side fix's
      # shapes are target-portable; this pins that the JVM backend (which was
      # already correct here) stays in parity.
      - name: Funcval return materialization self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/funcval_ret_materialize_self_test.l

      # Interface slice-arg self-test on JVM (#6369) — JVM lowers every list
      # literal to a uniform `ArrayList`, so it never had the MSIL
      # `T[]`-vs-`List<object>` divergence; this pins that the MSIL-side fix
      # didn't skew the two targets apart.
      - name: Interface slice-arg self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/iface_slice_arg_self_test.l

      # List-literal indexed-read self-test, JVM leg (#5686 parity fix for
      # MSIL's #5620): an unannotated homogeneous list literal (`val xs =
      # [9, 7]`) now records its peeked element type (`inferHomogeneousListElemTypeJvm`,
      # 02_exprs.l) against the binding, so `indexedElemTypeOverride` narrows
      # `xs[i]` from erased `Object` to the real element type instead of
      # panicking on a following relational/arithmetic use.  The runtime
      # representation stays a plain `ArrayList` (JVM has no reified
      # generics); only the compiler's own type tracking changed.  dotnet
      # half (the original #5620 fix) runs in compiler-self-tests-dotnet-a.
      - name: List-literal index self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/list_literal_index_self_test.l

      # Double-stringification fixed/scientific-notation boundary self-test,
      # JVM leg (#5660 follow-up, review finding #6749 against PR #6631):
      # asserts `emitNormalizeDoubleString`'s exp=16/exp=17 threshold against
      # the SAME strings the dotnet leg (compiler-self-tests-dotnet-a) gets
      # from real .NET `Double.ToString()`, at and one ULP either side of the
      # boundary. Imports only `Std.*`.
      - name: Double-stringification boundary self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/double_stringify_boundary_self_test.l

      # Distinct/range-subtype static-factory self-test on JVM (#5956): the
      # JVM backend now emits the same `Type.from`/`Type.tryFrom` construction
      # API MSIL synthesises (`Jvm.Lowering.lowerDistinctType`), so this file
      # runs unmodified on both targets — the dotnet leg (load-bearing per
      # its own header) runs in the compiler-self-tests job above.
      - name: Range-subtype self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/range_subtype_self_test.l

      # `UInt`/`ULong`-backed range-subtype self-test — JVM-ONLY (#6661):
      # `UInt`/`ULong` have no MSIL representation at all, so this file (unlike
      # range_subtype_self_test.l above) is never run on --target dotnet.
      - name: Unsigned range-subtype self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/range_subtype_unsigned_jvm_self_test.l

      # `UInt`/`ULong` generic-container erasure self-test — JVM-ONLY (#6695):
      # `isPrimitiveTypeKeyword` (`Jvm.Codegen`) had no `UInt`/`ULong` case, so
      # `List[UInt]`/`Option[UInt]` (and the `ULong` counterparts) resolved a
      # phantom same-package class through `eagerlyResolveGenericArg` instead
      # of the real erased `JInt`/`JLong` representation. `UInt`/`ULong` have
      # no MSIL representation at all, so this file is JVM-only.
      - name: UInt/ULong generic-container erasure self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/jvm/generic_uint_erasure_jvm_self_test.l

      # Subscript-assignment self-test (#1707, #6169, #6741) — dual-target,
      # never wired into CI before now: covers map/list/slice indexed read,
      # write, and compound-assign, including the #6741 plain-`=` numeric-
      # widening fix.
      - name: Subscript-assignment self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/jvm/subscript_assign_jvm_self_test.l

      - name: Subscript-assignment self-test on dotnet (native lyric test)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh lyric-compiler/jvm/subscript_assign_jvm_self_test.l

      # `UInt`/`ULong` unsigned comparison/division/toString self-test
      # (#6748) — JVM-ONLY: `UInt`/`ULong` have no MSIL representation.
      - name: Unsigned UInt/ULong operations self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/jvm/unsigned_int_ops_jvm_self_test.l

      # Unannotated U16/U32/U64 list-literal element-type inference
      # self-test (#6741 SUGGESTION) — JVM-ONLY: the equivalent MSIL path
      # has a separate pre-existing bug tracked as #6761.
      - name: U16/U32/U64 list-literal element inference self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/jvm/list_literal_uint_elem_jvm_self_test.l

      # Await-hoist self-test on JVM (#5606/#5628, #5630) — JVM already
      # compiled every hoist shape correctly before the rewrite (the rewrite
      # is semantics-preserving there), so this pins that the shared rewrite
      # doesn't regress evaluation order on this target either.  dotnet half
      # (the load-bearing target) runs in the compiler-self-tests-dotnet-a job.
      - name: Await-hoist self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/await_hoist_self_test.l

      # `?`-operand-position hoist on JVM (#6448, D-progress-762) — the
      # stackmap-frame VerifyError half of the dual-target crash class; the
      # dotnet half runs in the compiler-self-tests-dotnet-a job.
      - name: Propagate-hoist self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/propagate_hoist_self_test.l

      # config-block self-test on JVM (#3228, wired in #6198) — the
      # load-bearing half: JVM `config { }` emission (static fields + a
      # `<clinit>` env-var reader) shipped in #3228.  Env-var overrides are
      # exported below and inherited by the `java` subprocess.  Also covers
      # an env var set to "" falling back to the default (#6204).  The
      # required-field-missing exit(78) case (#6200) runs dotnet-only in
      # compiler-self-tests-dotnet-a (config_block_missing_required_self_test.l)
      # — its two test bodies still cover both targets' exit(78) behavior via
      # a nested Emitter.Dotnet/Emitter.Jvm fixture.  dotnet half of THIS
      # file runs in the docs/58 job.
      - name: config-block self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        env:
          LYRIC_CONFIG_LYRIC_CONFIGBLOCKSELFTEST_OVERRIDES_PORT: "9090"
          LYRIC_CONFIG_LYRIC_CONFIGBLOCKSELFTEST_OVERRIDES_LIMIT: "4294967296"
          LYRIC_CONFIG_LYRIC_CONFIGBLOCKSELFTEST_OVERRIDES_RATE: "2.5"
          LYRIC_CONFIG_LYRIC_CONFIGBLOCKSELFTEST_OVERRIDES_RATIO: "3.5"
          LYRIC_CONFIG_LYRIC_CONFIGBLOCKSELFTEST_OVERRIDES_ENABLED: "true"
          LYRIC_CONFIG_LYRIC_CONFIGBLOCKSELFTEST_OVERRIDES_HOST: "override-host"
          LYRIC_CONFIG_LYRIC_CONFIGBLOCKSELFTEST_REQUIRED_SECRET: "s3cr3t"
          LYRIC_CONFIG_LYRIC_CONFIGBLOCKSELFTEST_EMPTYOVERRIDE_HOST: ""
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/config_block_self_test.l

      # JVM half of the compound-assign String self-test (#5657).  The JVM
      # `s += <Double>` path spills the rhs to a slot before the (branching)
      # Double `.0`-normalization so the stringification is verifiable — before
      # the fix this was a class-load VerifyError.  dotnet half runs in
      # compiler-self-tests-dotnet-a.
      - name: Compound-assign String self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/compound_string_assign_self_test.l

      # JVM half of the UFCS self-field self-test (#5565) — the load-bearing
      # target: before the fix, an out-of-body UFCS method reading a `self` field
      # panicked on JVM ("erased receiver").  dotnet half runs in
      # compiler-self-tests-dotnet-a.
      - name: UFCS self-field self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/ufcs_self_field_self_test.l

      # JVM half of the Bool stringification cross-target parity check
      # (#5552) — see the dotnet-side step above for the full rationale.
      - name: Bool stringification self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/bool_tostring_self_test.l

      # #3693/#3705-shape generic-specialisation regression on the JVM
      # single-file build (docs/59 §5.4 item: JVM single-file mono decl
      # feeding).  The file's header always claimed a jvm run but none was
      # wired; this pins isOk/isErr specialisation over interface/record
      # Results on the `lyric test --target jvm` single-file pipeline.
      - name: Result-generic-specialisation self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/result_generic_specialization_self_test.l

      # Single-file `@cfg` erasure parity on JVM — the JVM half of the
      # dotnet-job case (docs/59 §5.4): the same source must see the same
      # `@cfg(feature = ...)` erasure and `target.jvm` pseudo-feature
      # selection on both targets.
      - name: Cfg single-file self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/cfg_single_file_self_test.l

      # Byte-arithmetic self-test on JVM — the JVM half of the dotnet-job step
      # of the same name (docs/59 §4.3).  The canonical in-slot `JByte` form is
      # masked-unsigned 0..255: these cases pin unsigned division/modulo,
      # every compound-assignment path, and the >= 128 equality/ordering/
      # wraparound/boxing behaviour to the same values MSIL produces.
      - name: Byte-arithmetic self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/byte_arithmetic_self_test.l

      # exposed record on JVM (#6526) — the JVM half of the dotnet-job step
      # of the same name.  `IExposedRec` was missing from four of the JVM
      # backend's item "collect" pre-passes, leaving `exposed record`
      # construction/field-access/compound-assignment non-functional on
      # --target jvm (NoSuchMethodError at construction; J008 panic on any
      # numeric field's compound-assignment) while MSIL worked throughout.
      - name: Exposed-record field self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/exposed_record_field_self_test.l

      # Slice-ops self-test on JVM (#5244) — the JVM half of the dotnet-job
      # step of the same name.  JVM slices are uniformly `Object[]`
      # (`Jvm.Codegen`'s `TSlice(_) -> JArray(elem = Object)` erasure), so
      # this exercises the same `.append`/`.concat`/`.slice` lowerings via
      # `System.arraycopy` + `newarray`/`anewarray` rather than MSIL's dual
      # array/`List<object>` representation.
      - name: Slice-ops self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/slice_ops_self_test.l

      # Block-shadow self-test on JVM (#5191 / D-progress-603) — the JVM half of
      # the dotnet-job step of the same name.  Pins the general nested-block
      # shadowing fix (slot-reuse gate + scope undo log) on the JVM backend.
      - name: Block-shadow self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/block_shadow_self_test.l

      # Match-bound pattern type self-test on JVM (#5422, #5423 /
      # D-progress-833) — the JVM half of the dotnet-job step of the same
      # name.
      - name: Match-bound pattern type self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/match_bound_pattern_type_self_test.l

      # Nested-slice for-loop self-test on JVM (#6541) — the load-bearing
      # target for this fix: a `for`-in-`for` loop over a nested
      # `slice[slice[T]]` element used to crash with "does not implement
      # Iterable" (the array element narrowed to erased `Object` instead
      # of `JArray`, so the inner loop picked the wrong codegen branch).
      - name: Nested-slice for-loop self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/nested_slice_for_jvm_self_test.l

      # JVM-trio self-test on JVM (#6122/#6123/#6124) — the JVM half of the
      # dotnet-job step of the same name, and the load-bearing target for all
      # three fixes: a `while`+`match` with mixed loop-continuing/loop-ending
      # arms (nested-constructor pattern TEST recursion in `03_match.l`), a
      # value-producing arm after a mid-chain `panic` in an
      # `if`/`else if`/`else` (terminating-arm type inference in
      # `02_exprs.l`), and `.indexOf`/`.lastIndexOf` file-scoped
      # `Std.String` UFCS routing (`FuncCtx.importsStdString` in
      # `04_calls.l`/`06_items.l`).
      - name: JVM-trio self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/jvm_trio_self_test.l

      # JVM-trio positive-path self-test (#6124) — confirms a file that DOES
      # import `Std.String` (unaliased)
      # still gets `.indexOf`/`.lastIndexOf` routed through the `Option[Int]`
      # UFCS form, i.e. `FuncCtx.importsStdString`'s file-scoped gate did not
      # regress the working case alongside fixing the cross-file corruption.
      - name: JVM-trio positive-path self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/jvm_trio_positive_self_test.l

      # Try/finally early-exit self-test on JVM (#5765) — the JVM half of the
      # dotnet-job step of the same name, and the load-bearing target for this
      # fix: pins that `return`/`break`/`continue` inside a try body or catch
      # arm routes through the enclosing `finally` (via the deferStack the JVM
      # backend already uses for `defer`/`scope`), matching MSIL's `leave`.
      - name: Try/finally early-exit self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/try_finally_early_exit_self_test.l

      # slice[Byte]-index lambda-argument self-test on JVM (#5934).  Runtime
      # regression pin for the MSIL Func-ABI box/unbox type mismatch: a
      # `slice[Byte]` index expression passed directly to a `(Byte) -> Bool`
      # lambda parameter must box as the callee's unbox type (Int32's scalar
