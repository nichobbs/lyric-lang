        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/jvm/file_jvm_self_test.l
      # Std.Console stdin/stdout/stderr round-trip on JVM (band J6, #2669) —
      # first executable proof of the pure-Lyric `_kernel_jvm/console_host.l`
      # (`getstatic System.{out,err,in}` via the static-field auto-FFI path,
