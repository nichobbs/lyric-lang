      # std/_kernel_jvm/process_piped_host.l's read side actually works —
      # the previous BufferedReader.readLine()-based version was unreliable.
      - name: Std.Process piped-spawn real cat round trip on JVM (lyric build --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${BUILD_CONFIG}/net10.0/lyric"
          if [ ! -x "$lyric_bin" ]; then
            echo "::error::AOT binary not found at $lyric_bin; skipping Std.Process piped-spawn JVM check"
            exit 1
          fi
          work="$(mktemp -d)"
          "$lyric_bin" build lyric-compiler/jvm/piped_process_jvm_main.l --target jvm -o "$work/pipedprocess.jar"
          # set +e/set -e around the capture: the program returns its
          # failure count as the exit code, and a failing command
          # substitution under `set -e` would abort before the echo/grep
          # diagnostics below ever ran.
          set +e
          out="$(timeout 30 java -jar "$work/pipedprocess.jar")"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::piped_process_jvm_main exited $code (#6135 regression, or a hang past the 30s cap)"
            exit 1
