        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-retry-on-signal.sh bash scripts/ci/self-test.sh lyric-compiler/lyric/double_stringify_boundary_self_test.l

      # Extra barrier (batch 1a-split-2, #5859): the sub-batch below the
      # 1a-split barrier had grown to 13 concurrent steps — one below the
