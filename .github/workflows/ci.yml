          grep -qx "arg0=four" <<< "$out" || { echo "::error::arg0 line missing"; exit 1; }
          grep -qx "arg1=five" <<< "$out" || { echo "::error::arg1 line missing"; exit 1; }

      # Std.Environment.args() class-init ordering-hazard check on JVM
