      # unsupported.  Needs JDK 21 (this job).  Imports only `Std.*`.
      - name: Result/Option accessor self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: "bash scripts/ci/self-test.sh --summary \"result/option accessor self-test ran: result_ensures_accessor_self_test.l (--target jvm)\" --target jvm lyric-compiler/lyric/result_ensures_accessor_self_test.l"

      # #6630 regression, JVM half of the --target dotnet negative test
      # above: a user-defined 2-type-arg union named `Result` (declared
      # OUTSIDE Std.Core) must get a clean T0124 type error on `.isOk`, not
      # have the reserved Std.Core.Result accessor sugar mis-lower it. The
      # type checker is shared between targets (both `Msil.Bridge` and
      # `Jvm.Bridge` call `Lyric.TypeChecker.checkFile`), so the same
      # fixture and expected diagnostic apply here unchanged — see
      # scripts/ci/check-foreign-result-accessor.sh (shared with the
      # dotnet step above).
      - name: Foreign Result/Option accessor fails loud, not a miscompile (native lyric build --target jvm, #6630)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/check-foreign-result-accessor.sh jvm

      # B'-mode runtime self-test on JVM (#4600) — the load-bearing half: pins
      # the JVM bridge post-weave re-scan fix (B'-mode's synthesised
      # `__lyric_bmode_*` functions + `__LyricBModeCallContext`/`__LyricBModeCfg_*`/
      # `__LyricBModeArgs_*` records are now visible to codegen), which before
      # this fix produced a compile-time `has no known field` panic and a
      # runtime `NoSuchMethodError`.  dotnet half runs in the dotnet job.
      - name: B'-mode runtime self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: "bash scripts/ci/self-test.sh --summary \"B'-mode runtime self-test ran: bmode_runtime_self_test.l (--target jvm)\" --target jvm lyric-compiler/lyric/bmode_runtime_self_test.l"

      # ensures:-over-String-if-body self-test on JVM (#2033) — the JVM half of
      # the dotnet-job `ensures_self_test.l` run.  `ensures:` is a cross-target
      # construct but the guard previously ran dotnet-only; the monomorphizer
      # fix it pins is both-target, and the JVM path is confirmed green.
      - name: ensures self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: "bash scripts/ci/self-test.sh --summary \"ensures self-test ran: ensures_self_test.l (--target jvm)\" --target jvm lyric-compiler/lyric/ensures_self_test.l"

      # pconstructor typed-binding self-test on JVM (#3284) — the JVM half of
      # the dotnet-job `pconstructor_typed_binding_self_test.l` run.  Pins JVM
      # parity for typed protected-constructor bindings; the JVM path is
      # confirmed green.
      - name: pconstructor typed-binding self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: "bash scripts/ci/self-test.sh --summary \"pconstructor typed-binding self-test ran: pconstructor_typed_binding_self_test.l (--target jvm)\" --target jvm lyric-compiler/lyric/pconstructor_typed_binding_self_test.l"

      # Stdlib-generic-interface self-test on JVM (#3613) — the JVM half of
      # the dotnet-job step of the same name.  Pins `emitUnboxObjectTo`'s new
      # `JRef` arm: a generic field payload (`Result[Shape, String]`'s `Ok`
      # value) erases to `Object`, and dispatching a call on the bound match
      # variable used to panic ("no matching instance or inherited method for
      # 'java.lang.Object.area()'") because no `checkcast <Shape>` was ever
      # emitted.  Also pins `bindCaseField` threading a nested generic
      # instantiation (`Result[Option[Shape], String]`) to the bound name's
      # own `varGenericArgs`, so a match-of-a-match recovers its inner arg.
      # Needs JDK 21 (this job), unlike the dotnet job.
      - name: Stdlib-generic-interface self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: "bash scripts/ci/self-test.sh --summary \"stdlib-generic-iface self-test ran: stdlib_generic_iface_self_test.l (--target jvm)\" --target jvm lyric-compiler/lyric/stdlib_generic_iface_self_test.l"

      # Named-arg/default-param self-test on JVM — pins call-site reorder and
      # default fill on the JVM target (#1503).  Imports only `Std.*`.
      - name: Named-arg/default-param self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: "bash scripts/ci/self-test.sh --summary \"named-arg/default-param self-test ran: func_default_args_self_test.l (--target jvm)\" --target jvm lyric-compiler/lyric/func_default_args_self_test.l"

      # Numeric / character conversion-method self-test (#1901, Band-1 of epic
      # #1470).  Exercises `.toByte()` / `.toInt()` / `.toLong()` / `.toChar()`
      # / `.toDouble()` end-to-end: the type checker types each conversion and
      # both backends lower it to native width-conversion opcodes (`conv.*` on
      # MSIL; `i2l`/`l2i`/`d2i`/… on the JVM, with `.toByte()` masked to the
      # unsigned 0..255 range to match MSIL's `conv.u1`).  Run on BOTH targets —
      # parity is asserted, not deferred.  Imports only `Std.*`.
      - name: Conversion-method self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/conv_methods_self_test.l

      # Pattern-lowering self-test (#2455).  Exercises the five match-arm pattern
      # forms that the self-hosted MSIL and JVM backends previously left
      # unhandled in `lowerPatternTest` / `lowerPatternBind` — `PParen`,
      # `PRange`, `PRecord`, `PTuple`, `PTypeTest` — plus the supporting
      # record/union/tuple construction, field access, and call-site argument
      # coercion the JVM target needed to run them.  Run on BOTH targets:
      # parity is asserted, not deferred.  Imports only `Std.*`.
      - name: Pattern-lowering self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -x .bootstrap/stage2/bin/lyric ]; then
            echo "::error::stage 2 binary missing; skipping pattern-lowering JVM self-test"
            exit 1
          fi
          export LYRIC_STDLIB_BIN="$PWD/.bootstrap/stage2/lib"
          .bootstrap/stage2/bin/lyric test --target jvm lyric-compiler/lyric/pattern_lowering_self_test.l

      # Auto-FFI metadata-resolution self-test — exercises the self-hosted
      # MSIL emitter resolving `ExternTypeName.method(args)` calls against
      # real .NET reference-assembly metadata (epic #1622, Phase 3c) and
      # emitting the real MemberRef instead of the legacy guess.  Run via
      # native `lyric test`: the program is compiled in-process through the
      # self-hosted `Msil.Bridge`, whose codegen reads the reference pack at
      # compile time, then executed with its runtime values asserted.  No new
      # F#.  Imports only `Std.*`, so no `LYRIC_LOAD_COMPILER=1`.
      - name: Auto-FFI metadata self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        # #6662's instance-method/constructor overload-scoring tests resolve
        # a small fixture class through auto-FFI at compile time; build its
        # jar and put it on LYRIC_FFI_JARS before compiling the test file.
        run: |
          set -euo pipefail
          fixture_jar="$(bash scripts/ci/build-auto-ffi-fixture.sh)"
          LYRIC_FFI_JARS="$fixture_jar" bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/auto_ffi_jvm_self_test.l
      # Generic-declaring-type @externTarget member self-test — the JVM analog
      # of generic_extern_self_test.l (#3432).  Unlike MSIL's closed-GENERICINST
      # emitGenericExternMember, JVM erasure means the generic extern-type alias
      # resolves to its raw host class directly (#5458); this test's real load-
      # bearing regression coverage is collectMonoSpecializedSigs now threading
      # holder-array param types + paramModes into the cross-package call
      # registry, so a monomorphized generic function's `out`/`inout` parameter
      # (`cdTryGetValue[K, V]`, mirroring Web.Kernel.Jvm's rate limiter) resolves
      # against its real holder-typed descriptor instead of NoSuchMethodError.
      - name: Generic-declaring-type extern member self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/generic_extern_jvm_self_test.l
      # JVM twin of the dotnet-only slice[T].append numeric-widening
      # regression (#5254 MSIL, #5257 JVM) that runs in
      # compiler-self-tests-dotnet-a — every `slice[T]` erases uniformly to
      # `Object[]` on the JVM, so an M6-numeric-widened `.append` argument
      # used to box against the erased Object[] target (Integer) instead of
      # the receiver's declared element type (Long).  Imports only `Std.*`.
      - name: slice[T].append numeric-widening self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/slice_append_widening_self_test.l
      # Negative test: an ambiguous primitive-array overload must fail loud,
      # not silently guess.  A Lyric slice[T] argument erases to Object[]
      # before the JVM auto-FFI resolver ever sees it -- but since #6662
      # (2026-08-27), `ffiScoreDescFor` recovers the argument's TRUE declared
      # Lyric element type (via `indexedElemTypeOverride`, the same
      # bare-name/field/param declared-type registry `EIndex` narrowing
      # already consults) for any argument the compiler can actually TRACK
      # the declared type of -- a bare local/param/field typed `slice[Char]`
      # now scores ONLY against `String(char[])` (`String(byte[])` no longer
      # even ties, since the recovered score descriptor is the concrete "[C",
      # not the erased "[Ljava/lang/Object;" checkPrimitiveArraySliceAmbiguity
      # keys off of), so that former repro is no longer ambiguous at all --
      # verified by javap'ing the emitted class: it invokes
      # `String.<init>:([C)V`, never `([B)V`.  The genuine remaining gap is
      # an argument whose declared element type the compiler CANNOT recover
      # this way: an `if`/`else` expression's result is not one of the
      # tracked shapes (`scrutineeGenericArgs` has no `EIf` arm, unlike its
      # `ECall`/`EList`/`EMember`/`EPath` arms), so `chosen`'s element type is
      # lost even though both branches are ordinary fully-materialized
      # `slice[Char]` locals (verified by javap + a real JVM run against an
      # unambiguous single-overload target: the `if`/`else` result is a
      # genuine `Object[]` of boxed `Character`s at runtime, not a
      # verifier-rejecting half-built value) -- `String(char[])` and
      # `String(byte[])` genuinely tie again here, exactly the case
      # checkPrimitiveArraySliceAmbiguity (jvm/auto_ffi.l) exists to reject at
      # compile time rather than resolve to whichever overload happens to
      # appear first in the parsed class metadata.  This is a compile-time
      # panic inside the self-hosted compiler process itself, not a runtime
      # Bug the compiled program could catch, so it cannot be expressed as a
      # @test_module assertion -- asserted here as a `lyric build` failure
      # instead.
      - name: Ambiguous primitive-array overload fails loud on JVM (native lyric build --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap/stage1 ] || [ ! -f .bootstrap/stage1/Lyric.Lyric.Cli.dll ]; then
            echo "::error::stage 1 bundle missing; skipping ambiguous-overload JVM negative test"
            exit 1
          fi
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${BUILD_CONFIG}/net10.0/lyric"
          if [ ! -x "$lyric_bin" ]; then
            echo "::error::AOT binary not found at $lyric_bin; skipping ambiguous-overload JVM negative test"
            exit 1
          fi
          dir="$(mktemp -d)"
          neg="$dir/ambig.l"
          cat > "$neg" <<'LYRIC'
          package Ambig
          import Std.Core
          extern type JString = "java.lang.String"
          func main(): Int {
            val a: slice[Char] = ['h', 'i']
            val b: slice[Char] = ['b', 'y']
            val cond = true
            val chosen = if cond { a } else { b }
            val s = JString.new(chosen)
            println(s.toString())
            0
          }
          LYRIC
          if "$lyric_bin" build --target jvm "$neg" -o "$dir/ambig.jar" > "$dir/ambig.out" 2>&1; then
            echo "::error::ambiguous slice[Char] overload (String(char[]) vs String(byte[])) compiled — checkPrimitiveArraySliceAmbiguity did not fire"; cat "$dir/ambig.out"; exit 1
          fi
          if ! grep -qi "ambiguous overload" "$dir/ambig.out"; then
            echo "::error::ambiguous slice[Char] overload failed without the expected diagnostic"; cat "$dir/ambig.out"; exit 1
          fi
          echo "OK: ambiguous primitive-array overload (String(char[]) vs String(byte[])) for an if/else-sourced slice[Char] argument fails loud."
      # Negative test (#6745): a GENUINE primitive-array argument (a real
      # `int[]`, not a `slice[T]` narrowed for scoring purposes only) must
      # never resolve against an `Object[]`-only overload.  `Arrays.copyOf`'s
      # actual JDK-metadata-resolved return type is a real `int[]` -- unlike
      # a `slice[T]` local, it is never re-erased back to `Object[]` -- so
      # `grown` below carries the exact shape `scoreParamMatch`'s
      # reverse-compatibility arm (#6696) used to accept unconditionally.
      # `Arrays.asList` has exactly one overload, `<T> List<T> asList(T...
      # a)`, erased to `(Object[])List` -- before the #6745 fix this silently
      # "matched" with no coercion emitted (`emitFfiCoerce` has no rule to
      # box a real primitive array element-by-element into a fresh
      # `Object[]`), corrupting the emitted bytecode with a real `int[]`
      # reference where `Object[]` is expected: VerifyError at class load.
      # After the fix, `argIsNarrowedSliceErasure` correctly gates the arm
      # off for this genuinely-real argument, so no overload scores >= 0 and
      # the call fails loud at compile time instead -- same pattern as the
      # ambiguous-overload negative test above (a compile-time panic inside
      # the compiler process itself, not expressible as a @test_module
      # runtime assertion).
      - name: Genuine primitive-array argument rejected for an Object[]-only overload on JVM (native lyric build --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap/stage1 ] || [ ! -f .bootstrap/stage1/Lyric.Lyric.Cli.dll ]; then
            echo "::error::stage 1 bundle missing; skipping genuine-primitive-array JVM negative test"
            exit 1
          fi
          lyric_bin="bootstrap/src/Lyric.Cli.Aot/bin/${BUILD_CONFIG}/net10.0/lyric"
          if [ ! -x "$lyric_bin" ]; then
            echo "::error::AOT binary not found at $lyric_bin; skipping genuine-primitive-array JVM negative test"
            exit 1
          fi
          dir="$(mktemp -d)"
          neg="$dir/genuine_prim_array.l"
          cat > "$neg" <<'LYRIC'
          package GenuinePrimArray
          import Std.Core
          import Std.Collections
          extern type JArrays = "java.util.Arrays"
          func main(): Int {
            val src: slice[Int] = [1, 2, 3]
            val grown = JArrays.copyOf(src, 5)
            val xs = JArrays.asList(grown)
            println("size=" + xs.size().toString())
            0
          }
          LYRIC
          if "$lyric_bin" build --target jvm "$neg" -o "$dir/genuine_prim_array.jar" > "$dir/genuine_prim_array.out" 2>&1; then
            echo "::error::a genuine int[] argument (Arrays.copyOf's real return type) compiled against Arrays.asList's Object[]-only overload with no coercion — scoreParamMatch's reverse-compatibility arm fired for a non-narrowed argument"; cat "$dir/genuine_prim_array.out"; exit 1
          fi
          if ! grep -qi "no matching static overload" "$dir/genuine_prim_array.out"; then
            echo "::error::genuine int[] argument against an Object[]-only overload failed without the expected diagnostic"; cat "$dir/genuine_prim_array.out"; exit 1
          fi
          echo "OK: a genuine primitive-array argument correctly fails loud against an Object[]-only overload instead of silently miscompiling."
      # Hash self-test on JVM — proves the target-aware kernel source loader
      # (docs/44 J6 M-10) loads `lyric-stdlib/std/_kernel_jvm/hash_host.l` and
      # the JVM SHA-512 host (M-9, java.security.MessageDigest + HexFormat via
      # auto-FFI) computes correct digests.  Importing `Std.Hash` resolves to
      # the JVM kernel on this target; the test asserts three NIST SHA-512
      # vectors under `java`.  First native JVM self-test that depends on a
      # `_kernel_jvm`-only module.  Imports only `Std.*`.
      # Concurrency cap (JVM): this job ran all 56 background steps at once —
      # each compiles in-process via Jvm.Bridge AND spawns a `java` process, the
      # heaviest self-test shape — which is well past the ~18 peak documented as
      # safe on the dotnet self-test jobs. Three barriers (here and two below)
      # split it into ~14-step batches so peak concurrency (and peak JVM memory)
      # stays bounded, stopping the intermittent concurrent-status flakes.
      - name: Wait for parallel tests (JVM batch 1)
        wait-all: true

      # BuildInfo `--define` runtime path on JVM (docs/60 §5, #5852): the JVM
      # twin of the dotnet step above — asserts `--define`-supplied values flow
      # through the synthesized `buildInfo()` accessor to a runtime value on
      # `--target jvm` (issue #5852 item 5). The native twin is the
      # "Native --define build" step in `native-backend-self-tests` (#5977 closed).
      # The fixture
      # imports only `Std.BuildInfo` + `Std.Console` (not `Std.Core`), guarding
      # the #5949 core-prelude resolution on the JVM target too.
      - name: BuildInfo --define runtime path on JVM (native lyric build --target jvm --define)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/buildinfo-define-jvm-runtime.sh
      - name: Hash self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/hash_jvm_self_test.l
      # Stdlib JVM kernel migration off extern package (a no-op mechanism in
      # both the type checker and both codegens): environment_host.l,
      # process_host.l, log_host.l, unicode_host.l migrated onto plain
      # extern type + JVM auto-FFI.  Before this migration every function in
      # these four files crashed immediately on first call.  Imports only
      # `Std.*`, so no `LYRIC_LOAD_COMPILER=1`.
      - name: Stdlib JVM kernels self-test (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/stdlib_jvm_kernels_self_test.l
      # Silent-miscompile guard (JVM, band J1 / #2664 / epic #2663): pins the
      # five JVM-backend codegen fixes that previously produced wrong-but-running
      # output — Float emitted as 32-bit (not double), complex assignment
      # (`obj.field = e` / `arr[i] = e`) actually stores, or-pattern variable
      # binding (`A(x)|B(x) -> x`), union-case construction (incl. nullary cases,
      # #1675) round-tripping through match, and named-argument record-construction
      # reorder (#1793).  Imports only `Std.*`.
      - name: Silent-miscompile guard self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -x .bootstrap/stage2/bin/lyric ]; then
            echo "::error::stage 2 binary missing; skipping silent-miscompile guard JVM self-test"
            exit 1
          fi
          export LYRIC_STDLIB_BIN="$PWD/.bootstrap/stage2/lib"
          .bootstrap/stage2/bin/lyric test --target jvm lyric-compiler/jvm/silent_miscompile_guard_jvm_self_test.l
      # Erased-element checkcast (JVM, #5055/#5381/#5249/#5439): pins the fix
      # that narrows an indexed List[T]/slice[T] element back to its
      # statically-declared type (checkcast for refs, unbox for primitives)
      # so field access / method dispatch / numeric intrinsics on the element
      # work instead of collapsing to java/lang/Object.  Imports only `Std.*`.
      - name: Erased-element checkcast self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -x .bootstrap/stage2/bin/lyric ]; then
            echo "::error::stage 2 binary missing; skipping erased-element checkcast JVM self-test"
            exit 1
          fi
          export LYRIC_STDLIB_BIN="$PWD/.bootstrap/stage2/lib"
          .bootstrap/stage2/bin/lyric test --target jvm lyric-compiler/jvm/erased_element_checkcast_jvm_self_test.l
      # out/inout parameter parity (docs/44 m-3, #1763, follow-up to #1761) —
      # exercises the JVM holder-array lowering for free-function `out`/`inout`
      # parameters: the caller wraps each holder argument in a single-element
      # array pre-filled with the local's value, passes it, and copies element 0
      # back after the call; the callee unwraps on entry and writes through on
      # every assignment.  Covers out String/Int/Long, multiple out, inout
      # read-modify-write, nested inout forwarding, and mixed-mode signatures.
      # Imports only `Std.*`, so no `LYRIC_LOAD_COMPILER=1`.
      - name: out/inout parameter self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/jvm/out_inout_jvm_self_test.l
      # Middle-end-passes guard (band J2, docs/44 §5, #2665, epic #2663) —
      # exercises the target-agnostic middle-end passes J2 wired into the
      # self-hosted JVM bridge: `@cfg` erasure (an inactive-feature item is
      # dropped before type-check) and aspect weaving (an `@inline_template`
      # `around` rewrites a matched function's body).  Both are asserted at
      # runtime through `compileToJarBundled`.  (`?`-propagation is also wired
      # by J2 and verified on MSIL via `propagate_self_test.l`; its generic
      # `Result`/`Option` output awaits JVM generics in J4 before it can run
      # under `java`.)  Imports only `Std.*`, so no `LYRIC_LOAD_COMPILER=1`.
      - name: Middle-end-passes guard self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/jvm/middle_end_passes_jvm_self_test.l
      # J3 lowering self-test (JVM, band J3 / #2666 / epic #2663): pins the
      # codegen dispatch wired to the `jvm/lowering.l` capabilities that were
      # previously unreachable (silently dropped bodies) — opaque-type
      # construction + accessor field read, protected-type field-args ctor +
      # lock-wrapped entries with bare-name field resolution, wire-block DI
      # `bootstrap()` + exposed-singleton accessor, plus `defer` (normal +
      # early-return, mirroring MSIL #1477) and module-level `val` as a
      # `static final` field.  Imports only `Std.*`.
      - name: J3 lowering self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ ! -x .bootstrap/stage2/bin/lyric ]; then
            echo "::error::stage 2 binary missing; skipping J3 lowering JVM self-test"
            exit 1
          fi
          export LYRIC_STDLIB_BIN="$PWD/.bootstrap/stage2/lib"
          .bootstrap/stage2/bin/lyric test --target jvm lyric-compiler/jvm/j3_lowering_self_test.l
      # `defer` self-test on JVM (J4, epic #2663 / #2667, #4878).  The value-
      # position, trailing/consecutive, and panic-unwind `defer` forms all
      # produced invalid bytecode on the JVM (VerifyError / "Illegal exception
      # table range") and this suite was previously run only on `--target dotnet`,
      # so the breakage went unnoticed.  Pins all six forms (reverse-order fall-
      # off, early return with value, break, continue, exception unwind, and a
      # value-producing sub-block) now that the region-boundary StackMapTable and
      # empty-region/dead-nop fixes have landed.  Imports only `Std.*`.
      - name: Defer self-test on JVM (native lyric test --target jvm)
        background: true
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/self-test.sh --target jvm lyric-compiler/lyric/defer_self_test.l

      # Extra barrier (JVM batch 3-split): keeps this group under the ~14-step
      # cap (was 15) so the runner's parallel-step status collection doesn't
      # misreport a passing step as failed.
      - name: Wait for parallel tests (JVM batch 3-split)
        wait-all: true

      # Range-for self-test on JVM (#4878 follow-up, band J4).  Range-driven `for`
      # (`for i in lo ..< hi` / `lo ..= hi`) reached MSIL parity via
