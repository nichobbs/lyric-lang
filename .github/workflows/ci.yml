      # Std.Uuid end-to-end on JVM — the JVM leg of the D-N-026 tri-target
      # four-format parse contract (the dotnet leg runs via `lyric run` in
      # the stdlib coverage block; the native leg via llvm_stdlib_self_test).
      # Pins the shared canonicalizer + the java.util.UUID kernel twin's
