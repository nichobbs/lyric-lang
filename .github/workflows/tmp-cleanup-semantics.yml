name: tmp-cleanup-semantics
on:
  push:
    branches: [claude/tmp-cleanup-semantics]
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  build:
    needs: [create]
    strategy:
      fail-fast: false
      matrix:
        leg: [good, bad, slow]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          case "${{ matrix.leg }}" in
            bad) exit 1 ;;
            slow) sleep 300 ;;
          esac
  win:
    needs: [create]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  nuget:
    needs: [build, win, create]
    runs-on: ubuntu-latest
    steps:
      - run: echo nuget
  cleanup:
    runs-on: ubuntu-latest
    needs: [create, build, win, nuget]
    if: >-
      always() &&
      needs.create.result == 'success' &&
      (needs.build.result == 'failure' || needs.build.result == 'cancelled' ||
       needs.nuget.result == 'failure' || needs.nuget.result == 'cancelled')
    steps:
      - run: echo "CLEANUP RAN"
  report:
    runs-on: ubuntu-latest
    needs: [create, build, win, nuget, cleanup]
    if: always()
    steps:
      - run: |
          echo "build=${{ needs.build.result }} win=${{ needs.win.result }} nuget=${{ needs.nuget.result }} cleanup=${{ needs.cleanup.result }}"
