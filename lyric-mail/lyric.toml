[package]
name        = "Lyric.Mail"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Email sending library for Lyric: SMTP, Amazon SES, and SendGrid providers."

[project]
name            = "Lyric.Mail"
output          = "single"
output_assembly = "Mail.dll"

[project.packages]
"Mail"            = "src/mail.l"
"Mail.Kernel.Net" = "src/_kernel/net/mail_kernel.l"
"Mail.Kernel.Jvm" = "src/_kernel/jvm/mail_kernel.l"

[project.tests]
"Mail.MailTests" = "tests/mail_tests.l"

[features]
default  = ["dotnet", "smtp", "ses", "sendgrid"]
# Platform kernel selection (D-N-013 target normalization swaps these
# automatically per `--target`; see docs/24-build-features.md §2.3).
dotnet   = []
jvm      = []
smtp     = []   # SMTP via System.Net.Mail (MailKit on .NET); not yet implemented on jvm
ses      = []   # Amazon SES (AWSSDK.SimpleEmail on .NET); not yet implemented on either target
sendgrid = []   # SendGrid (SendGrid .NET library); not yet implemented on either target

[nuget]
# feature = "smtp" — SMTP client for .NET
"MailKit"              = "4.17.0"
# feature = "ses" — AWS SDK SES module for .NET
"AWSSDK.SimpleEmail"   = "3.7.300"
# feature = "sendgrid" — SendGrid .NET client
"SendGrid"             = "9.29.3"
