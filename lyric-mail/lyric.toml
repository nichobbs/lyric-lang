[package]
name        = "Lyric.Mail"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Email sending library for Lyric: SMTP, Amazon SES, and SendGrid providers."

[project]
name            = "Lyric.Mail"
output          = "single"
output_assembly = "Mail.dll"

[project.packages]
"Mail"            = "src/mail.l"
"Mail.Kernel.Net" = "src/_kernel/net/mail_kernel.l"
"Mail.Kernel.Jvm" = "src/_kernel/jvm/mail_kernel.l"

[project.tests]
"Mail.MailTests" = "tests/mail_tests.l"

[features]
default  = ["dotnet", "smtp", "ses", "sendgrid"]
# Platform kernel selection (D-N-013 target normalization swaps these
# automatically per `--target`; see docs/24-build-features.md §2.3).
dotnet   = []
jvm      = []
smtp     = []   # SMTP via System.Net.Mail (BCL, no extra NuGet dependency) on .NET; Jakarta Mail (Angus) on jvm
ses      = []   # Amazon SES v2 over Std.Http (SigV4), both targets
sendgrid = []   # SendGrid v3 over Std.Http, both targets

# feature = "jvm" + "smtp": Jakarta Mail API and the Eclipse Angus
# implementation (SMTP provider) behind src/_kernel/jvm/mail_kernel.l.
# SES and SendGrid are plain HTTPS over Std.Http and need no JAR.
[maven]
"jakarta.mail:jakarta.mail-api"  = "2.1.3"
"org.eclipse.angus:angus-mail"   = "2.0.3"
