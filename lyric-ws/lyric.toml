[package]
name        = "Lyric.Ws"
version     = "0.1.0"
stability = "stable"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "WebSocket server library for Lyric: connection lifecycle, message routing, and authentication aspects."

[project]
name            = "Lyric.Ws"
output          = "single"
output_assembly = "Ws.dll"

[project.packages]
"Ws"            = "src/ws.l"
"Ws.Frame"      = "src/ws_frame.l"
"Ws.Handshake"  = "src/ws_handshake.l"
"Ws.Aspects"    = "src/ws_aspects.l"
# Ws.Kernel.Net is one package in several files: the RFC 6455 server shared by
# `dotnet`, `jvm` and `native` (ws_kernel.l), and its per-target primitives
# (locks, background threads, sleep, handler isolation; the concurrent
# dictionary on dotnet in net/ws_prims.l and on jvm and native in ws_dict.l).
"Ws.Kernel.Net" = [
  "src/_kernel/net/ws_kernel.l",
  "src/_kernel/net/ws_prims.l",
  "src/_kernel/net/ws_dict.l",
  "src/_kernel/jvm/ws_prims.l",
  "src/_kernel/native/ws_prims.l",
]

[project.tests]
"Ws.WsTests"                       = "tests/ws_tests.l"
"Ws.WsFrameTests"                  = "tests/ws_frame_tests.l"
"Ws.WsHandshakeTests"              = "tests/ws_handshake_tests.l"
"Ws.WsE2eTests"                    = "tests/ws_e2e_tests.l"
"Ws.WsHardeningTests"               = "tests/ws_hardening_tests.l"
"Ws.WsSecurityAspectWeavingTests"  = "tests/ws_security_aspect_weaving_tests.l"

[features]
default = ["dotnet"]
dotnet = []   # pure-Lyric RFC 6455 over Std.TcpHost (Ws.Kernel.Net, #778)
jvm    = []   # the same server on the JVM (docs/73 S7a)
native = []   # the same pure-Lyric RFC 6455 over Std.TcpHost, on --target native

[dependencies]
"Lyric.Auth"   = { workspace = true }
"Lyric.Resilience" = { workspace = true }

# [nuget] — no third-party packages needed for the current .NET kernel
# implementation: Ws.Kernel.Net is pure-Lyric RFC 6455 over Std.TcpHost
# (System.Net.Sockets), not ASP.NET Core WebSockets — see Ws.Kernel.Net's
# module header (docs/62-jsonrpc-mcp.md §6, #778).
