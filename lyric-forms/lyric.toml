[package]
name        = "Lyric.Forms"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Pure form building blocks for Lyric: draft parsing, field errors, and form schemas (docs/65)."

[project]
name            = "Lyric.Forms"
output          = "single"
output_assembly = "Forms.dll"

[project.packages]
"Forms"       = "src/forms.l"
"Forms.Parse" = "src/parse.l"

[project.tests]
"Forms.FormsTests" = "tests/forms_tests.l"
