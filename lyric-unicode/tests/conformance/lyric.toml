# Unicode's own conformance suites for lyric-unicode's text algorithms (#8498, D371).
#
#   BidiCharacterTest.txt  UAX #9, Unicode 15.1.0 (ucd/BidiCharacterTest.txt)
#   LineBreakTest.txt      UAX #14, Unicode 15.1.0 (ucd/auxiliary/LineBreakTest.txt)
#
# Both are vendored unchanged under the Unicode licence (LICENSE-UNICODE.txt) and pinned by SHA-256 in
# conformance.l.  `lyric test --manifest lyric-unicode/tests/conformance/lyric.toml` runs them on dotnet
# (and with --target jvm on the JVM); `lyric build --target native` builds main.l, which runs them on
# the native backend.
[package]
name    = "Lyric.Unicode.Conformance"
version = "0.1.0"
license = "Apache-2.0"

[project]
name = "Lyric.Unicode.Conformance"

[project.packages]
"Unicode.Conformance"      = "conformance.l"
"Unicode.Conformance.Main" = "main.l"

[project.tests]
"Unicode.ConformanceTests" = "conformance_tests.l"

[dependencies]
"Lyric.Unicode" = { path = "../.." }
