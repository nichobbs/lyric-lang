[package]
name        = "Lyric.Mq"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Transport-agnostic message queue library for Lyric: publish, consume, dead-letter, and idempotency aspects."

[project]
name            = "Lyric.Mq"
output          = "single"
output_assembly = "Mq.dll"

[project.packages]
"Mq"              = "src/mq.l"
"Mq.Aspects"      = "src/mq_aspects.l"
"Mq.InMemory"     = "src/inmemory.l"

[project.tests]
"Mq.MqTests" = "tests/mq_tests.l"
"Mq.MqAspectWeavingTests" = "tests/mq_aspect_weaving_tests.l"
"Mq.MqConcurrencyDotnetTests" = "tests/mq_concurrency_dotnet_tests.l"
"Mq.MqConcurrencyJvmTests" = "tests/mq_concurrency_jvm_tests.l"
"Mq.MqDeadLetterConcurrencyDotnetTests" = "tests/mq_deadletter_concurrency_dotnet_tests.l"
"Mq.MqDeadLetterConcurrencyJvmTests" = "tests/mq_deadletter_concurrency_jvm_tests.l"


[dependencies]
"Lyric.Cache"  = { workspace = true }


