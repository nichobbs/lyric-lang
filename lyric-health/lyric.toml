[package]
name        = "Lyric.Health"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Liveness and readiness health-check endpoints for lyric-web services."

[features]
default = ["dotnet"]
# BCL Task.Run/Task.Wait bounded-wait for check timeouts.
dotnet  = []
# No preemptive bounded-wait facility exists on this target yet (see
# Health.runCheckIsolated's @cfg(feature = "jvm") arm and README.md).
jvm     = []

[project]
name            = "Lyric.Health"
output          = "single"
output_assembly = "Health.dll"

[project.packages]
"Health"            = "src/health.l"
"Health.Kernel.Net" = "src/_kernel/net/health_kernel.l"

[project.tests]
"Health.HealthTests" = "tests/health_tests.l"
