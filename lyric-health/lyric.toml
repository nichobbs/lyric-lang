[package]
name        = "Lyric.Health"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Liveness and readiness health-check endpoints for lyric-web services."

[features]
default = ["dotnet"]
# `Health` itself is now target-agnostic (#7461): `runCheckIsolated`'s
# bounded-wait timeout is enforced on both targets via `Std.Task.runWithin`.
# These flags are kept purely for CI target selection
# (`--target jvm --no-default-features --features jvm`); no `@cfg` in this
# package's own source branches on them any more.
dotnet  = []
jvm     = []

[project]
name            = "Lyric.Health"
output          = "single"
output_assembly = "Health.dll"

[project.packages]
"Health" = "src/health.l"

[project.tests]
"Health.HealthTests" = "tests/health_tests.l"
