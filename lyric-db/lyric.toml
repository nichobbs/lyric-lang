[package]
name        = "Lyric.Db"
version     = "0.1.0"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Database access library for Lyric with a driver-agnostic interface and aspect templates."

[project]
name            = "Lyric.Db"
output          = "single"
output_assembly = "Db.dll"

[project.packages]
"Db"            = "src/db.l"
"Db.Aspects"    = "src/db_aspects.l"
"Db.Kernel.Net" = "src/_kernel/net/db_kernel.l"
"Db.Kernel.Jvm" = "src/_kernel/jvm/db_kernel.l"

[project.tests]
"Db.DbTests"                = "tests/db_tests.l"
"Db.SqliteTests"            = "tests/db_sqlite_tests.l"
"Db.PostgresConnectTests"   = "tests/db_postgres_connect_tests.l"
"Db.KernelNetTests"         = "tests/db_kernel_net_tests.l"
"Db.KernelJvmTests"         = "tests/db_kernel_jvm_tests.l"

[features]
# `dotnet` and `jvm` are MUTUALLY EXCLUSIVE and select the kernel: `Db.Kernel.Net`
# is gated on `dotnet`, `Db.Kernel.Jvm` on `jvm`.  `dotnet` is the default; a
# `--target jvm` build swaps it for `jvm` (docs/24 §2.2 target normalization),
# or select it explicitly:
#   --target jvm --no-default-features --features jvm,sqlite,postgres
default  = ["dotnet", "postgres", "sqlite"]    # both drivers compiled in unless overridden
dotnet   = []    # ADO.NET kernel (Db.Kernel.Net)
jvm      = []    # JDBC kernel (Db.Kernel.Jvm)
postgres = []    # enable the PostgreSQL driver (Npgsql / org.postgresql)
sqlite   = []    # enable the SQLite driver (Microsoft.Data.Sqlite / org.xerial sqlite-jdbc)

[dependencies]
"Std.Logging"   = { workspace = true }

[nuget]
# feature = "postgres" — Npgsql ADO.NET driver for PostgreSQL
"Npgsql" = "8.0.3"
# feature = "sqlite" — Microsoft.Data.Sqlite ADO.NET driver for SQLite
"Microsoft.Data.Sqlite" = "8.0.3"

[maven]
# feature = "postgres" (target jvm) — PostgreSQL JDBC driver
"org.postgresql:postgresql" = "42.7.14"
# feature = "sqlite" (target jvm) — SQLite JDBC driver (bundles the native library)
"org.xerial:sqlite-jdbc" = "3.53.4.0"
